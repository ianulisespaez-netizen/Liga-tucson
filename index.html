<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liga Tucson</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172f55;
        }


        header {
            background: linear-gradient(
                135deg,
                #173d6b,
                #4d86bd
            );

            color: white;
            text-align: center;
            padding: 35px 15px;
        }


        header h1 {
            margin: 0;
            font-size: 38px;
        }


        header p {
            margin: 8px 0 0;
            font-size: 17px;
        }


        .contenedor {
            max-width: 1100px;
            margin: auto;
            padding: 25px 18px;
        }


        /* ==========================
           NAVEGACIÓN
        ========================== */

        .navegacion {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }


        .nav-boton {
            background: white;
            color: #173d6b;
            text-decoration: none;
            text-align: center;
            padding: 16px 10px;
            border-radius: 15px;
            font-weight: bold;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.06);
        }


        .nav-boton:hover {
            background: #173d6b;
            color: white;
        }


        /* ==========================
           BUSCADOR
        ========================== */

        .buscador {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.07);
        }


        .buscador h2 {
            margin-top: 0;
        }


        .buscador input {
            width: 100%;
            padding: 15px;

            border: 1px solid #d4dce7;
            border-radius: 12px;

            font-size: 16px;
            outline: none;
        }


        .buscador input:focus {
            border-color: #4ca0d8;
        }


        .resultado-equipo {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #f1f5f9;

            padding: 14px;
            margin-top: 8px;

            border-radius: 12px;
        }


        .resultado-equipo a {
            color: #173d6b;
            text-decoration: none;
            font-weight: bold;
        }


        .resultado-equipo span {
            color: #687891;
            font-size: 14px;
        }


        /* ==========================
           TITULOS
        ========================== */

        .titulo-seccion {
            font-size: 27px;
            margin: 30px 0 15px;
        }


        /* ==========================
           ZONAS
        ========================== */

        .zonas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }


        .zona {
            display: block;

            background: white;
            color: #172f55;

            text-decoration: none;

            border-radius: 20px;
            padding: 22px;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.07);

            transition: transform 0.15s;
        }


        .zona:hover {
            transform: translateY(-2px);
        }


        .zona h3 {
            margin-top: 0;

            border-left:
                6px solid #4ca0d8;

            padding-left: 10px;
        }


        .lider {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #f1f5f9;

            padding: 15px;
            border-radius: 12px;
        }


        .lider strong {
            font-size: 18px;
        }


        .puntos {
            font-size: 22px;
            font-weight: bold;
            color: #173d6b;
        }


        .ver-zona {
            margin-top: 12px;
            color: #4d86bd;
            font-size: 14px;
            font-weight: bold;
        }


        /* ==========================
           PARTIDOS
        ========================== */

        .partido {
            background: white;
            border-radius: 18px;

            padding: 18px;
            margin-bottom: 12px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.05);
        }


        .partido-fecha {
            color: #687891;
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: bold;
        }


        .partido-equipos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }


        .partido-equipo {
            width: 40%;
            font-weight: bold;
        }


        .local {
            text-align: right;
        }


        .visitante {
            text-align: left;
        }


        .partido-equipo a {
            color: #173d6b;
            text-decoration: none;
        }


        .resultado {
            font-size: 20px;
            font-weight: bold;
            color: #173d6b;
            text-align: center;

            min-width: 70px;
        }


        .estado {
            text-align: center;
            margin-top: 8px;

            font-size: 12px;
            font-weight: bold;
        }


        .finalizado {
            color: #16803c;
        }


        .proximo {
            color: #2878b8;
        }


        .ver-mas {
            display: block;
            text-align: center;

            margin-top: 15px;

            color: #173d6b;
            text-decoration: none;
            font-weight: bold;
        }


        /* ==========================
           FOOTER
        ========================== */

        footer {
            margin-top: 35px;

            background: #173d6b;
            color: white;

            text-align: center;

            padding: 25px 15px;
        }


        footer p {
            margin: 5px;
        }


        /* ==========================
           CELULAR
        ========================== */

        @media (max-width: 700px) {

            header h1 {
                font-size: 31px;
            }


            .navegacion {
                grid-template-columns: 1fr;
            }


            .zonas {
                grid-template-columns: 1fr;
            }


            .partido-equipo {
                font-size: 14px;
            }


            .resultado {
                font-size: 18px;
                min-width: 55px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        ⚽ LIGA TUCSON
    </h1>

    <p>
        Primera División A · Clausura 2026
    </p>

</header>


<div class="contenedor">


    <!-- ==========================
         NAVEGACIÓN
    ========================== -->

    <div class="navegacion">

        <a
            href="posiciones.html"
            class="nav-boton"
        >
            📊 Posiciones
        </a>


        <a
            href="partidos.html"
            class="nav-boton"
        >
            ⚽ Partidos
        </a>


        <a
            href="equipos.html"
            class="nav-boton"
        >
            🏟️ Equipos
        </a>

    </div>


    <!-- ==========================
         BUSCADOR
    ========================== -->

    <div class="buscador">

        <h2>
            🔎 Buscar equipo
        </h2>

        <input
            type="text"
            id="buscadorEquipo"
            placeholder="Escribí el nombre del equipo..."
            autocomplete="off"
        >

        <div
            id="resultadosBusqueda"
        ></div>

    </div>


    <!-- ==========================
         LÍDERES
    ========================== -->

    <h2 class="titulo-seccion">

        🏆 Líderes por zona

    </h2>


    <div
        id="lideres"
        class="zonas"
    >

        Cargando zonas...

    </div>


    <!-- ==========================
         RESULTADOS
    ========================== -->

    <h2 class="titulo-seccion">

        ⚽ Últimos resultados

    </h2>


    <div id="ultimosResultados">

        Cargando...

    </div>


    <!-- ==========================
         PRÓXIMOS
    ========================== -->

    <h2 class="titulo-seccion">

        📅 Próximos partidos

    </h2>


    <div id="proximosPartidos">

        Cargando...

    </div>


</div>


<footer>

    <p>
        ⚽ Liga Tucson
    </p>

    <p>
        Primera División A · Clausura 2026
    </p>

</footer>


<!-- ==========================
     CARGAR DATOS
========================== -->

<script src="datos.js"></script>


<script>


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const buscador =
        document.getElementById(
            "buscadorEquipo"
        );


    const resultadosBusqueda =
        document.getElementById(
            "resultadosBusqueda"
        );


    const lideres =
        document.getElementById(
            "lideres"
        );


    const ultimosResultados =
        document.getElementById(
            "ultimosResultados"
        );


    const proximosPartidos =
        document.getElementById(
            "proximosPartidos"
        );


    // ==========================================
    // ZONAS
    // ==========================================

    const zonas =
        ["A", "B", "C", "D", "E", "F"];


    // ==========================================
    // OBTENER TODOS LOS EQUIPOS
    // ==========================================

    let todosLosEquipos = [];


    zonas.forEach(zona => {

        if (!datosLiga.zonas[zona]) {
            return;
        }


        datosLiga.zonas[zona].forEach(equipo => {

            todosLosEquipos.push({

                nombre: equipo.equipo,

                zona: zona,

                datos: equipo

            });

        });

    });


    // ==========================================
    // NORMALIZAR TEXTO
    // ==========================================

    function normalizar(texto) {

        return texto
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .trim();

    }


    // ==========================================
    // CALCULAR PUNTOS
    // ==========================================

    function calcularPuntos(equipo) {

        return (
            Number(equipo.pg) * 3
        ) +
        Number(equipo.pe);

    }


    // ==========================================
    // BUSCADOR
    // ==========================================

    buscador.addEventListener(
        "input",
        function() {


            const texto =
                normalizar(
                    buscador.value
                );


            resultadosBusqueda.innerHTML =
                "";


            if (texto === "") {

                return;

            }


            const encontrados =
                todosLosEquipos.filter(item =>

                    normalizar(
                        item.nombre
                    ).includes(texto)

                );


            if (encontrados.length === 0) {

                resultadosBusqueda.innerHTML = `

                    <p>
                        ❌ No encontramos ese equipo.
                    </p>

                `;

                return;

            }


            encontrados.forEach(item => {


                resultadosBusqueda.innerHTML += `

                    <div class="resultado-equipo">

                        <a
                            href="equipo.html?v=5&equipo=${encodeURIComponent(item.nombre)}&zona=${encodeURIComponent(item.zona)}"
                        >

                            ${item.nombre}

                        </a>


                        <span>

                            Zona ${item.zona}

                        </span>

                    </div>

                `;

            });

        }
    );


    // ==========================================
    // LÍDERES DE CADA ZONA
    // ==========================================

    let htmlLideres = "";


    zonas.forEach(zona => {


        const equipos =
            datosLiga.zonas[zona];


        if (!equipos) {
            return;
        }


        const tabla =
            [...equipos].sort((a, b) => {


                const puntosA =
                    calcularPuntos(a);


                const puntosB =
                    calcularPuntos(b);


                if (puntosA !== puntosB) {

                    return puntosB - puntosA;

                }


                return b.dg - a.dg;

            });


        const lider =
            tabla[0];


        const puntos =
            calcularPuntos(lider);


        htmlLideres += `

            <a
                href="posiciones.html?zona=${zona}"
                class="zona"
            >

                <h3>
                    Zona ${zona}
                </h3>


                <div class="lider">

                    <div>

                        <strong>
                            ${lider.equipo}
                        </strong>

                        <br>

                        <span>
                            ${lider.pg} V ·
                            ${lider.pe} E ·
                            ${lider.pp} D
                        </span>

                    </div>


                    <div class="puntos">

                        ${puntos} pts

                    </div>

                </div>


                <div class="ver-zona">

                    Ver posiciones de Zona ${zona} →

                </div>

            </a>

        `;

    });


    lideres.innerHTML =
        htmlLideres;


    // ==========================================
    // ENLACE A EQUIPO
    // ==========================================

    function enlaceEquipo(
        nombre,
        zona
    ) {

        return `

            <a
                href="equipo.html?v=5&equipo=${encodeURIComponent(nombre)}&zona=${encodeURIComponent(zona)}"
            >
                ${nombre}
            </a>

        `;

    }


    // ==========================================
    // ÚLTIMOS RESULTADOS
    // ==========================================

    const resultados =
        datosLiga.partidos
        .filter(partido =>

            partido.resultado &&
            partido.resultado !== "-"

        )
        .slice(-5)
        .reverse();


    if (resultados.length === 0) {

        ultimosResultados.innerHTML = `

            <div class="partido">

                Todavía no hay resultados
                cargados.

            </div>

        `;

    } else {


        let html = "";


        resultados.forEach(partido => {


            html += `

                <div class="partido">


                    <div class="partido-fecha">

                        ${partido.fecha || "Fecha 5"}

                    </div>


                    <div class="partido-equipos">


                        <div class="partido-equipo local">

                            ${enlaceEquipo(
                                partido.local,
                                partido.zona
                            )}

                        </div>


                        <div class="resultado">

                            ${partido.resultado}

                        </div>


                        <div class="partido-equipo visitante">

                            ${enlaceEquipo(
                                partido.visitante,
                                partido.zona
                            )}

                        </div>


                    </div>


                    <div class="estado finalizado">

                        ✓ FINALIZADO

                    </div>

                </div>

            `;

        });


        ultimosResultados.innerHTML =
            html;

    }


    // ==========================================
    // PRÓXIMOS PARTIDOS
    // ==========================================

    const proximos =
        datosLiga.partidos
        .filter(partido =>

            !partido.resultado ||
            partido.resultado === "-"

        )
        .slice(0, 5);


    if (proximos.length === 0) {

        proximosPartidos.innerHTML = `

            <div class="partido">

                No hay próximos partidos
                cargados.

            </div>

        `;

    } else {


        let html = "";


        proximos.forEach(partido => {


            html += `

                <div class="partido">


                    <div class="partido-fecha">

                        ${partido.fecha || "Próximamente"}

                    </div>


                    <div class="partido-equipos">


                        <div class="partido-equipo local">

                            ${enlaceEquipo(
                                partido.local,
                                partido.zona
                            )}

                        </div>


                        <div class="resultado">

                            VS

                        </div>


                        <div class="partido-equipo visitante">

                            ${enlaceEquipo(
                                partido.visitante,
                                partido.zona
                            )}

                        </div>


                    </div>


                    <div class="estado proximo">

                        ◷ PRÓXIMO PARTIDO

                    </div>

                </div>

            `;

        });


        proximosPartidos.innerHTML =
            html;

    }


    proximosPartidos.innerHTML += `

        <a
            href="partidos.html"
            class="ver-mas"
        >

            Ver todos los partidos →

        </a>

    `;


</script>


</body>

</html>
