<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipos - Liga Tucson</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172f55;
        }

        header {
            background: linear-gradient(135deg, #173d6b, #4d86bd);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            padding: 25px 18px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 25px;
            color: #173d6b;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .titulo {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
        }

        .titulo h2 {
            margin: 0 0 8px 0;
            font-size: 32px;
        }

        .titulo p {
            margin: 0;
            color: #687891;
            font-size: 18px;
        }

        .zona {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
        }

        .zona h2 {
            margin-top: 0;
            font-size: 27px;
            border-left: 7px solid #4ca0d8;
            padding-left: 12px;
        }

        .equipos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .equipo {
            background: #f1f5f9;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .nombre-equipo {
            font-size: 18px;
            font-weight: bold;
        }

        .boton {
            background: #173d6b;
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .boton:hover {
            background: #4ca0d8;
        }

        @media (max-width: 600px) {

            .equipos {
                grid-template-columns: 1fr;
            }

            .equipo {
                padding: 18px;
            }

            .nombre-equipo {
                font-size: 17px;
            }

            .boton {
                padding: 9px 11px;
                font-size: 14px;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>⚽ LIGA TUCSON</h1>
</header>

<div class="contenedor">

    <a href="index.html" class="volver">← Volver al inicio</a>

    <div class="titulo">
        <h2>Equipos</h2>
        <p>Primera División A - Clausura 2026</p>
    </div>

    <div id="lista-equipos">
        Cargando equipos...
    </div>

</div>

<!-- Cargar los datos de la Liga -->
<script src="datos.js"></script>

<script>

    const contenedor = document.getElementById("lista-equipos");

    // Zonas que queremos mostrar
    const zonas = ["A", "B", "C", "D", "E", "F"];

    let contenido = "";

    zonas.forEach(zona => {

        const equipos = datosLiga.zonas[zona];

        if (!equipos) {
            return;
        }

        contenido += `
            <div class="zona">

                <h2>Zona ${zona}</h2>

                <div class="equipos">
        `;

        equipos.forEach(equipo => {

            contenido += `
                <div class="equipo">

                    <div class="nombre-equipo">
                        ${equipo.equipo}
                    </div>

                    <a
                        class="boton"
                        href="equipo.html?equipo=${encodeURIComponent(equipo.equipo)}&zona=${zona}"
                    >
                        Ver equipo
                    </a>

                </div>
            `;

        });

        contenido += `
                </div>
            </div>
        `;

    });

    contenedor.innerHTML = contenido;

</script>

</body>

</html>
