<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipos | Liga Tucson</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fa;
    color: #102a43;
}

header {
    background: #061a33;
    color: white;
    padding: 15px 20px;
}

.header-contenido {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.titulo {
    flex: 1;
}

.titulo h1 {
    margin: 0;
    font-size: 25px;
}

.titulo p {
    margin: 4px 0 0;
    color: #8bdcff;
    font-size: 13px;
}

nav {
    background: #0b3158;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
}

nav a:hover {
    color: #7edcff;
}

.contenedor {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

h2 {
    margin-top: 30px;
    color: #061a33;
}

.zona {
    margin-bottom: 40px;
}

.grid-equipos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.equipo {
    background: white;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.equipo:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

.escudo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin-bottom: 12px;
}

.equipo h3 {
    margin: 8px 0 15px;
    font-size: 18px;
}

.boton {
    display: inline-block;
    background: #087ec4;
    color: white;
    padding: 9px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.boton:hover {
    background: #055b91;
}

.sin-escudo {
    width: 100px;
    height: 100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5edf5;
    border-radius: 50%;
    color: #789;
    font-size: 12px;
}

footer {
    margin-top: 40px;
    background: #061a33;
    color: white;
    text-align: center;
    padding: 20px;
}

</style>
</head>

<body>

<header>

    <div class="header-contenido">

        <img
            class="logo"
            src="https://raw.githubusercontent.com/ianulisespaez-netizen/Liga-tucson/main/FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
            alt="Liga Tucson"
        >

        <div class="titulo">
            <h1>⚽ LIGA TUCSON</h1>
            <p>Primera División A - Clausura 2026</p>
        </div>

    </div>

</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="posiciones.html">Posiciones</a>
    <a href="partidos.html">Partidos</a>
    <a href="equipos.html">Equipos</a>
</nav>

<div class="contenedor">

    <h2>⚽ Equipos</h2>

    <div id="equipos-container"></div>

</div>

<footer>
    Liga Tucson © 2026
</footer>

<script src="datos.js"></script>

<script>

const escudos = {

    "Talleres": "IMG_1621.png",

    "Juventud Unida": "IMG_1622.png",

    "Estación Experimental": "IMG_1623.png",

    "Central Norte": "IMG_1624.jpeg",

    "Villa Mitre": "IMG_1625.jpeg",

    "All Boys": "IMG_1627.png",

    "San José": "IMG_1628.png"

};


const container = document.getElementById("equipos-container");

const zonas = ["A", "B", "C", "D", "E", "F"];


zonas.forEach(zona => {

    const equipos = datosLiga.zonas[zona];

    if (!equipos || equipos.length === 0) return;

    const zonaDiv = document.createElement("div");

    zonaDiv.className = "zona";

    zonaDiv.innerHTML = `<h2>Zona ${zona}</h2>`;

    const grid = document.createElement("div");

    grid.className = "grid-equipos";


    equipos.forEach(equipo => {

        const nombre = equipo.equipo;

        const archivoEscudo = escudos[nombre];

        const tarjeta = document.createElement("div");

        tarjeta.className = "equipo";


        let escudoHTML;

        if (archivoEscudo) {

            escudoHTML = `
                <img
                    class="escudo"
                    src="${archivoEscudo}"
                    alt="Escudo de ${nombre}"
                >
            `;

        } else {

            escudoHTML = `
                <div class="sin-escudo">
                    Sin escudo
                </div>
            `;

        }


        tarjeta.innerHTML = `

            ${escudoHTML}

            <h3>${nombre}</h3>

            <a
                class="boton"
                href="equipo.html?v=6&equipo=${encodeURIComponent(nombre)}&zona=${zona}"
            >
                Ver equipo
            </a>

        `;


        grid.appendChild(tarjeta);

    });


    zonaDiv.appendChild(grid);

    container.appendChild(zonaDiv);

});

</script>

</body>
</html>
