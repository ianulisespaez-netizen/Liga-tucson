<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partidos | Liga Tucson</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7fb;
    color:#102a43;
}

/* =========================
   HEADER
========================= */

header{
    background:#062b55;
    color:white;
    padding:18px 20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
    color:#9ed8f5;
}

/* =========================
   NAV
========================= */

nav{
    background:#0a3d73;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
    font-weight:bold;
}

nav a:hover{
    background:#15558f;
}

/* =========================
   CONTENEDOR
========================= */

.contenedor{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* =========================
   TITULO
========================= */

.titulo{
    text-align:center;
    margin-bottom:20px;
}

.titulo h2{
    margin-bottom:5px;
}

.titulo p{
    color:#607d98;
}

/* =========================
   FILTROS
========================= */

.filtros{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

.filtros h3{
    margin-top:0;
    margin-bottom:18px;
}

.grupo-filtros{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.campo{
    display:flex;
    flex-direction:column;
}

.campo label{
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

.campo select{
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background:white;
    font-size:14px;
    color:#102a43;
}

.botones{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:8px;
    padding:11px 18px;
    font-weight:bold;
    cursor:pointer;
}

.btn-buscar{
    background:#087fbd;
    color:white;
}

.btn-buscar:hover{
    background:#066b9e;
}

.btn-limpiar{
    background:#e5e7eb;
    color:#263238;
}

.btn-limpiar:hover{
    background:#d1d5db;
}

/* =========================
   RESULTADOS
========================= */

.encabezado-resultados{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    gap:10px;
    flex-wrap:wrap;
}

.encabezado-resultados h3{
    margin:0;
}

.contador{
    background:#dff3ff;
    color:#075985;
    padding:7px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:14px;
}

/* =========================
   FECHA
========================= */

.bloque-fecha{
    margin-bottom:25px;
}

.fecha-titulo{
    background:#062b55;
    color:white;
    padding:12px 16px;
    border-radius:10px;
    margin-bottom:10px;
    font-weight:bold;
}

/* =========================
   PARTIDO
========================= */

.partido{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
}

.partido-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.zona{
    font-size:12px;
    font-weight:bold;
    background:#e8f5fb;
    color:#075985;
    padding:5px 9px;
    border-radius:15px;
}

.zona-interzonal{
    background:#dbeafe;
    color:#1d4ed8;
}

.estado{
    font-size:11px;
    font-weight:bold;
    padding:5px 9px;
    border-radius:15px;
}

.estado-finalizado{
    background:#dcfce7;
    color:#166534;
}

.estado-programado{
    background:#fef3c7;
    color:#92400e;
}

/* =========================
   EQUIPOS
========================= */

.equipos-partido{
    display:grid;
    grid-template-columns:1fr 80px 1fr;
    align-items:center;
    gap:10px;
}

.equipo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.equipo-local{
    justify-content:flex-end;
    text-align:right;
}

.escudo{
    width:42px;
    height:42px;
    object-fit:contain;
}

.marcador{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:#062b55;
}

.vs{
    font-size:15px;
    color:#718096;
}

/* =========================
   SIN RESULTADOS
========================= */

.sin-resultados{
    background:white;
    border-radius:12px;
    padding:35px 20px;
    text-align:center;
    color:#607d98;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .grupo-filtros{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    .grupo-filtros{
        grid-template-columns:1fr;
    }

    .equipos-partido{
        grid-template-columns:1fr 55px 1fr;
    }

    .equipo{
        flex-direction:column;
        text-align:center;
        font-size:13px;
    }

    .equipo-local{
        justify-content:center;
        text-align:center;
    }

    .escudo{
        width:38px;
        height:38px;
    }

}

</style>

</head>

<body>

<header>

    <h1>⚽ LIGA TUCSON</h1>

    <p>
        Primera División A - Clausura 2026
    </p>

</header>


<nav>

    <a href="index.html">Inicio</a>

    <a href="posiciones.html">Posiciones</a>

    <a href="partidos.html">Partidos</a>

    <a href="equipos.html">Equipos</a>

</nav>


<main class="contenedor">

    <section class="titulo">

        <h2>📅 Partidos</h2>

        <p>
            Fixture completo de la Primera División A
        </p>

    </section>


    <!-- =========================
         FILTROS
    ========================== -->

    <section class="filtros">

        <h3>🔎 Buscar partidos</h3>


        <div class="grupo-filtros">


            <!-- FECHA -->

            <div class="campo">

                <label for="filtroFecha">
                    Fecha
                </label>

                <select id="filtroFecha">

                    <option value="">
                        Todas las fechas
                    </option>

                </select>

            </div>


            <!-- ZONA -->

            <div class="campo">

                <label for="filtroZona">
                    Zona
                </label>

                <select id="filtroZona">

                    <option value="">
                        Todas las zonas
                    </option>

                    <option value="A">
                        Zona A
                    </option>

                    <option value="B">
                        Zona B
                    </option>

                    <option value="C">
                        Zona C
                    </option>

                    <option value="D">
                        Zona D
                    </option>

                    <option value="E">
                        Zona E
                    </option>

                    <option value="F">
                        Zona F
                    </option>

                    <option value="INTERZONAL">
                        Interzonal
                    </option>

                </select>

            </div>


            <!-- EQUIPO -->

            <div class="campo">

                <label for="filtroEquipo">
                    Equipo
                </label>

                <select id="filtroEquipo">

                    <option value="">
                        Todos los equipos
                    </option>

                </select>

            </div>


            <!-- ESTADO -->

            <div class="campo">

                <label for="filtroEstado">
                    Estado
                </label>

                <select id="filtroEstado">

                    <option value="">
                        Todos
                    </option>

                    <option value="finalizado">
                        Finalizados
                    </option>

                    <option value="programado">
                        Programados
                    </option>

                </select>

            </div>

        </div>


        <div class="botones">

            <button
                class="btn btn-buscar"
                onclick="aplicarFiltros()"
            >
                🔎 Buscar
            </button>


            <button
                class="btn btn-limpiar"
                onclick="limpiarFiltros()"
            >
                🔄 Limpiar filtros
            </button>

        </div>

    </section>


    <!-- =========================
         RESULTADOS
    ========================== -->

    <section>

        <div class="encabezado-resultados">

            <h3>
                Partidos encontrados
            </h3>

            <span
                class="contador"
                id="contador"
            >
                0 partidos
            </span>

        </div>


        <div id="listaPartidos"></div>

    </section>

</main>


<script src="datos.js"></script>


<script>

/* ==========================================
   ESCUDOS
========================================== */

const escudos = {

    "Talleres":"IMG_1621.png",

    "Juventud Unida":"IMG_1622.png",

    "Estación Experimental":"IMG_1623.png",

    "Central Norte":"21B48DFD-98C8-4EDD-B633-35738F9B089D.png",

    "Villa Mitre":"IMG_1625.jpeg",

    "All Boys":"IMG_1627.png",

    "San José":"IMG_1628.png",


    "Argentinos del Norte":"IMG_1629.png",

    "San Martín":"IMG_1630.png",

    "San Antonio":"IMG_1631.jpeg",

    "Atlético Tucumán":"IMG_1632.jpeg",

    "Sportivo Guzmán":"IMG_1633.png",

    "Amalia":"IMG_1634.png",

    "Tucumán Central":"IMG_1635.png",


    "Garmendia":"IMG_1637.jpeg",

    "Atlético Concepción":"IMG_1638.png",

    "San Juan":"9D389031-3751-4B06-A800-AE5B7A426605.png",

    "San Lorenzo (DG)":"IMG_1646.png",

    "Unión del Norte":"IMG_1641.jpeg",

    "Lastenia":"IMG_1645.png",

    "Cruz Alta":"IMG_1644.png",


    "Bella Vista":"IMG_1651.png",

    "San Fernando":"IMG_1652.png",

    "Almirante Brown":"IMG_1653.jpeg",

    "Famaillá":"IMG_1654.png",

    "Ateneo Parroquial Alderetes":"IMG_1655.png",

    "Santa Lucía":"IMG_1656.jpeg",

    "San Pablo":"IMG_1671.png",


    "Alto Verde":"IMG_1657.png",

    "Concepción FC":"IMG_1658.png",

    "Azucarera Argentina":"IMG_1659.png",

    "Ñuñorco":"IMG_1660.png",

    "Unión Simoca":"IMG_1661.jpeg",

    "San Ramón":"IMG_1662.jpeg",

    "Santa Rosa":"IMG_1663.png",

    "La Providencia":"IMG_1664.jpeg",


    "Deportivo Aguilares":"IMG_1665.png",

    "San Lorenzo (SA)":"IMG_1666.webp",

    "Jorge Newbery":"IMG_1673.png",

    "Graneros":"IMG_1667.jpeg",

    "Santa Ana":"IMG_1668.png",

    "Trinidad":"IMG_1669.png",

    "Marapa":"IMG_1670.jpeg",

    "Llorens":"IMG_1672.jpeg"

};


/* ==========================================
   URL DE ESCUDOS
========================================== */

const URL_ESCUDOS =
"https://raw.githubusercontent.com/ianulisespaez-netizen/Liga-tucson/main/";


/* ==========================================
   ELEMENTOS
========================================== */

const filtroFecha =
    document.getElementById("filtroFecha");

const filtroZona =
    document.getElementById("filtroZona");

const filtroEquipo =
    document.getElementById("filtroEquipo");

const filtroEstado =
    document.getElementById("filtroEstado");

const listaPartidos =
    document.getElementById("listaPartidos");

const contador =
    document.getElementById("contador");


/* ==========================================
   CARGAR FECHAS
========================================== */

function cargarFechas(){

    for(let i=1; i<=14; i++){

        const option =
            document.createElement("option");

        option.value = i;

        option.textContent =
            "Fecha " + i;

        filtroFecha.appendChild(option);

    }

}


/* ==========================================
   CARGAR EQUIPOS
========================================== */

function cargarEquipos(){

    const equipos = [];

    Object.keys(datosLiga.zonas)
        .forEach(zona => {

            datosLiga.zonas[zona]
                .forEach(item => {

                    if(!equipos.includes(item.equipo)){

                        equipos.push(item.equipo);

                    }

                });

        });


    equipos.sort((a,b)=>
        a.localeCompare(b,"es")
    );


    equipos.forEach(equipo => {

        const option =
            document.createElement("option");

        option.value = equipo;

        option.textContent = equipo;

        filtroEquipo.appendChild(option);

    });

}


/* ==========================================
   COMPROBAR ZONA
========================================== */

function partidoPerteneceAZona(partido,zona){

    if(!zona){
        return true;
    }


    if(zona === "INTERZONAL"){

        return partido.interzonal === true;

    }


    if(partido.zona === zona){

        return true;

    }


    if(
        partido.interzonal &&
        partido.zonas &&
        partido.zonas.includes(zona)
    ){

        return true;

    }


    return false;

}


/* ==========================================
   COMPROBAR EQUIPO
========================================== */

function partidoPerteneceAEquipo(partido,equipo){

    if(!equipo){

        return true;

    }


    return (
        partido.local === equipo ||
        partido.visitante === equipo
    );

}


/* ==========================================
   APLICAR FILTROS
========================================== */

function aplicarFiltros(){

    const fecha =
        filtroFecha.value;

    const zona =
        filtroZona.value;

    const equipo =
        filtroEquipo.value;

    const estado =
        filtroEstado.value;


    let partidos =
        datosLiga.partidos.filter(partido => {


            /* FECHA */

            if(
                fecha &&
                Number(partido.fecha) !==
                Number(fecha)
            ){

                return false;

            }


            /* ZONA */

            if(
                !partidoPerteneceAZona(
                    partido,
                    zona
                )
            ){

                return false;

            }


            /* EQUIPO */

            if(
                !partidoPerteneceAEquipo(
                    partido,
                    equipo
                )
            ){

                return false;

            }


            /* ESTADO */

            if(
                estado &&
                partido.estado !== estado
            ){

                return false;

            }


            return true;

        });


    mostrarPartidos(partidos);

}


/* ==========================================
   MOSTRAR PARTIDOS
========================================== */

function mostrarPartidos(partidos){

    listaPartidos.innerHTML = "";


    contador.textContent =
        partidos.length +
        (
            partidos.length === 1
                ? " partido"
                : " partidos"
        );


    if(partidos.length === 0){

        listaPartidos.innerHTML = `

            <div class="sin-resultados">

                <h3>😕 No se encontraron partidos</h3>

                <p>
                    Probá cambiando alguno de los filtros.
                </p>

            </div>

        `;

        return;

    }


    /* AGRUPAR POR FECHA */

    const fechas = {};


    partidos.forEach(partido => {

        if(!fechas[partido.fecha]){

            fechas[partido.fecha] = [];

        }

        fechas[partido.fecha].push(partido);

    });


    Object.keys(fechas)
        .sort((a,b)=>Number(a)-Number(b))
        .forEach(fecha => {


            const bloque =
                document.createElement("div");

            bloque.className =
                "bloque-fecha";


            const titulo =
                document.createElement("div");

            titulo.className =
                "fecha-titulo";

            titulo.textContent =
                "📅 Fecha " + fecha;


            bloque.appendChild(titulo);


            fechas[fecha].forEach(partido => {

                bloque.appendChild(
                    crearPartido(partido)
                );

            });


            listaPartidos.appendChild(bloque);

        });

}


/* ==========================================
   CREAR TARJETA DEL PARTIDO
========================================== */

function crearPartido(partido){

    const tarjeta =
        document.createElement("div");

    tarjeta.className =
        "partido";


    /* ZONA */

    let textoZona;

    if(partido.interzonal){

        textoZona = "INTERZONAL";

    }else{

        textoZona =
            "ZONA " + partido.zona;

    }


    const claseZona =
        partido.interzonal
            ? "zona zona-interzonal"
            : "zona";


    /* ESTADO */

    const textoEstado =
        partido.estado === "finalizado"
            ? "FINALIZADO"
            : "PROGRAMADO";


    const claseEstado =
        partido.estado === "finalizado"
            ? "estado estado-finalizado"
            : "estado estado-programado";


    /* MARCADOR */

    let marcador;

    if(partido.estado === "finalizado"){

        marcador = `

            <div class="marcador">

                ${partido.golesLocal}

                -

                ${partido.golesVisitante}

            </div>

        `;

    }else{

        marcador = `

            <div class="marcador">

                <span class="vs">VS</span>

            </div>

        `;

    }


    const escudoLocal =
        escudos[partido.local]
        ? URL_ESCUDOS + escudos[partido.local]
        : "";


    const escudoVisitante =
        escudos[partido.visitante]
        ? URL_ESCUDOS + escudos[partido.visitante]
        : "";


    tarjeta.innerHTML = `

        <div class="partido-top">

            <span class="${claseZona}">
                ${textoZona}
            </span>

            <span class="${claseEstado}">
                ${textoEstado}
            </span>

        </div>


        <div class="equipos-partido">


            <div class="equipo equipo-local">

                <span>
                    ${partido.local}
                </span>

                ${
                    escudoLocal
                    ?
                    `<img
                        class="escudo"
                        src="${escudoLocal}"
                        alt="${partido.local}"
                    >`
                    :
                    ""
                }

            </div>


            ${marcador}


            <div class="equipo">

                ${
                    escudoVisitante
                    ?
                    `<img
                        class="escudo"
                        src="${escudoVisitante}"
                        alt="${partido.visitante}"
                    >`
                    :
                    ""
                }

                <span>
                    ${partido.visitante}
                </span>

            </div>


        </div>

    `;


    return tarjeta;

}


/* ==========================================
   LIMPIAR FILTROS
========================================== */

function limpiarFiltros(){

    filtroFecha.value = "";

    filtroZona.value = "";

    filtroEquipo.value = "";

    filtroEstado.value = "";


    mostrarPartidos(
        datosLiga.partidos
    );

}


/* ==========================================
   INICIAR
========================================== */

cargarFechas();

cargarEquipos();

mostrarPartidos(
    datosLiga.partidos
);

</script>

</body>
</html>
