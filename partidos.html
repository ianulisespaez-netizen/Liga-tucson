<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partidos | Liga Tucson</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fa;
    color: #102a43;
}

/* =========================
   HEADER
========================= */

header {
    background: #061a33;
    color: white;
    padding: 15px 20px;
}

.header-contenido {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.titulo {
    flex: 1;
}

.titulo h1 {
    margin: 0;
    font-size: 25px;
}

.titulo p {
    margin: 4px 0 0;
    color: #8bdcff;
    font-size: 13px;
}

/* =========================
   NAVEGACIÓN
========================= */

nav {
    background: #0b3158;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
}

nav a:hover {
    color: #7edcff;
}

/* =========================
   CONTENIDO
========================= */

.contenedor {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

h2 {
    color: #061a33;
}

/* =========================
   FILTROS
========================= */

.filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0 30px;
}

.filtro {
    border: none;
    background: #dcecf7;
    color: #102a43;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

.filtro:hover {
    background: #c7e1f1;
}

.filtro.activo {
    background: linear-gradient(180deg, #a9d2ee, #65a8d5);
    color: white;
}

/* =========================
   LISTA DE PARTIDOS
========================= */

.partidos {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

/* =========================
   TARJETA
========================= */

.partido {
    background: white;
    border-radius: 24px;
    padding: 25px 28px 18px;
    box-shadow: 0 8px 25px rgba(30, 55, 80, 0.08);
}

/* =========================
   CABECERA DEL PARTIDO
========================= */

.cabecera-partido {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
}

.fecha {
    color: #68798c;
    font-size: 20px;
    font-weight: bold;
}

.estado {
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    background: #dff3e7;
    color: #287548;
}

.estado.proximo {
    background: #e2f0fb;
    color: #287fc2;
}

/* =========================
   ENFRENTAMIENTO
========================= */

.enfrentamiento {
    display: grid;
    grid-template-columns: 1fr 110px 1fr;
    align-items: center;
    gap: 15px;
}

/* =========================
   EQUIPO
========================= */

.equipo-partido {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    min-width: 0;
}

.escudo-partido {
    width: 105px;
    height: 105px;
    object-fit: contain;
    margin-bottom: 12px;
}

.nombre-equipo {
    color: #102a43;
    text-decoration: none;
    font-size: 21px;
    font-weight: bold;
    line-height: 1.2;
}

.nombre-equipo:hover {
    color: #087ec4;
}

/* =========================
   RESULTADO / VS
========================= */

.resultado {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    color: #061a33;
    white-space: nowrap;
}

.sin-resultado {
    font-size: 28px;
    color: #78899a;
}

/* =========================
   INFORMACIÓN
========================= */

.info-partido {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 2px solid #e8eef3;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;

    color: #68798c;
    font-size: 18px;
}

.info-partido span {
    display: flex;
    align-items: center;
    gap: 7px;
}

/* =========================
   SIN PARTIDOS
========================= */

.sin-partidos {
    background: white;
    border-radius: 20px;
    padding: 35px;
    text-align: center;
    color: #718296;
    font-size: 18px;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 45px;
    background: #061a33;
    color: white;
    text-align: center;
    padding: 20px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .header-contenido {
        flex-direction: column;
        text-align: center;
    }

    nav a {
        display: inline-block;
        margin: 5px 7px;
    }

    .contenedor {
        padding: 20px 12px;
    }

    .partido {
        padding: 25px 15px 18px;
        border-radius: 24px;
    }

    .filtros {
        gap: 12px;
    }

    .filtro {
        padding: 10px 18px;
    }

    .enfrentamiento {
        grid-template-columns: 1fr 65px 1fr;
        gap: 5px;
    }

    .escudo-partido {
        width: 85px;
        height: 85px;
    }

    .nombre-equipo {
        font-size: 17px;
    }

    .resultado {
        font-size: 28px;
    }

    .sin-resultado {
        font-size: 23px;
    }

    .fecha {
        font-size: 19px;
    }

    .estado {
        font-size: 17px;
        padding: 9px 18px;
    }

    .info-partido {
        flex-direction: column;
        gap: 8px;
        font-size: 16px;
    }
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-contenido">

        <img
            class="logo"
            src="https://raw.githubusercontent.com/ianulisespaez-netizen/Liga-tucson/main/FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
            alt="Liga Tucson"
        >

        <div class="titulo">

            <h1>⚽ LIGA TUCSON</h1>

            <p>
                Primera División A - Clausura 2026
            </p>

        </div>

    </div>

</header>


<!-- =========================
     NAVEGACIÓN
========================= -->

<nav>

    <a href="index.html">Inicio</a>
    <a href="posiciones.html">Posiciones</a>
    <a href="partidos.html">Partidos</a>
    <a href="equipos.html">Equipos</a>

</nav>


<!-- =========================
     CONTENIDO
========================= -->

<div class="contenedor">

    <h2>⚽ Partidos</h2>


    <!-- FILTROS -->

    <div class="filtros">

        <button class="filtro activo" data-zona="TODAS">
            Todas
        </button>

        <button class="filtro" data-zona="A">
            Zona A
        </button>

        <button class="filtro" data-zona="B">
            Zona B
        </button>

        <button class="filtro" data-zona="C">
            Zona C
        </button>

        <button class="filtro" data-zona="D">
            Zona D
        </button>

        <button class="filtro" data-zona="E">
            Zona E
        </button>

        <button class="filtro" data-zona="F">
            Zona F
        </button>

    </div>


    <!-- PARTIDOS -->

    <div
        id="partidos-container"
        class="partidos">
    </div>

</div>


<footer>

    Liga Tucson © 2026

</footer>


<script src="datos.js"></script>


<script>

/* =====================================================
   ESCUDOS
===================================================== */

const escudos = {

    /* ZONA A */

    "Talleres": "IMG_1621.png",
    "Juventud Unida": "IMG_1622.png",
    "Estación Experimental": "IMG_1623.png",
    "Central Norte": "21B48DFD-98C8-4EDD-B633-35738F9B089D.png",
    "Villa Mitre": "IMG_1625.jpeg",
    "All Boys": "IMG_1627.png",
    "San José": "IMG_1628.png",

    /* ZONA B */

    "Argentinos del Norte": "IMG_1629.png",
    "San Martín": "IMG_1630.png",
    "San Antonio": "IMG_1631.jpeg",
    "Atlético Tucumán": "IMG_1632.jpeg",
    "Sportivo Guzmán": "IMG_1633.png",
    "Amalia": "IMG_1634.png",
    "Tucumán Central": "IMG_1635.png",

    /* ZONA C */

    "Garmendia": "IMG_1637.jpeg",
    "Atlético Concepción": "IMG_1638.png",
    "San Juan": "9D389031-3751-4B06-A800-AE5B7A426605.png",
    "San Lorenzo (DG)": "IMG_1646.png",
    "Unión del Norte": "IMG_1641.jpeg",
    "Lastenia": "IMG_1645.png",
    "Cruz Alta": "IMG_1644.png",

    /* ZONA D */

    "Bella Vista": "IMG_1651.png",
    "San Fernando": "IMG_1652.png",
    "Almirante Brown": "IMG_1653.jpeg",
    "Famaillá": "IMG_1654.png",
    "Ateneo Parroquial Alderetes": "IMG_1655.png",
    "Santa Lucía": "IMG_1656.jpeg",
    "San Pablo": "IMG_1671.png",

    /* ZONA E */

    "Alto Verde": "IMG_1657.png",
    "Concepción FC": "IMG_1658.png",
    "Azucarera Argentina": "IMG_1659.png",
    "Ñuñorco": "IMG_1660.png",
    "Unión Simoca": "IMG_1661.jpeg",
    "San Ramón": "IMG_1662.jpeg",
    "Santa Rosa": "IMG_1663.png",
    "La Providencia": "IMG_1664.jpeg",

    /* ZONA F */

    "Deportivo Aguilares": "IMG_1665.png",
    "San Lorenzo (SA)": "IMG_1666.webp",
    "Jorge Newbery": "IMG_1673.png",
    "Graneros": "IMG_1667.jpeg",
    "Santa Ana": "IMG_1668.png",
    "Trinidad": "IMG_1669.png",
    "Marapa": "IMG_1670.jpeg",
    "Llorens": "IMG_1672.jpeg"

};


/* =====================================================
   ELEMENTOS
===================================================== */

const container =
    document.getElementById("partidos-container");

const botones =
    document.querySelectorAll(".filtro");


/* =====================================================
   OBTENER ZONA
===================================================== */

function obtenerZonaEquipo(nombre) {

    for (const zona of ["A", "B", "C", "D", "E", "F"]) {

        const equipos =
            datosLiga.zonas[zona];

        if (!equipos) continue;

        const encontrado =
            equipos.find(
                e => e.equipo === nombre
            );

        if (encontrado) {
            return zona;
        }
    }

    return "";
}


/* =====================================================
   MOSTRAR PARTIDOS
===================================================== */

function mostrarPartidos(
    zonaSeleccionada = "TODAS"
) {

    container.innerHTML = "";

    let partidos =
        datosLiga.partidos || [];


    /* FILTRAR ZONA */

    if (zonaSeleccionada !== "TODAS") {

        partidos =
            partidos.filter(partido => {

                const zonaLocal =
                    obtenerZonaEquipo(
                        partido.local
                    );

                const zonaVisitante =
                    obtenerZonaEquipo(
                        partido.visitante
                    );

                return (
                    zonaLocal === zonaSeleccionada ||
                    zonaVisitante === zonaSeleccionada
                );

            });

    }


    /* SIN PARTIDOS */

    if (partidos.length === 0) {

        container.innerHTML = `

            <div class="sin-partidos">

                No hay partidos cargados
                para esta zona.

            </div>

        `;

        return;
    }


    /* CREAR CADA PARTIDO */

    partidos.forEach(partido => {

        const local =
            partido.local;

        const visitante =
            partido.visitante;


        const zonaLocal =
            obtenerZonaEquipo(local);

        const zonaVisitante =
            obtenerZonaEquipo(visitante);


        const zona =
            zonaLocal || zonaVisitante;


        /* ESCUDOS */

        const escudoLocal =
            escudos[local];

        const escudoVisitante =
            escudos[visitante];


        /* RESULTADO */

        const tieneResultado =

            partido.golesLocal !== undefined &&
            partido.golesLocal !== null &&
            partido.golesVisitante !== undefined &&
            partido.golesVisitante !== null;


        let resultadoHTML;


        if (tieneResultado) {

            resultadoHTML = `

                <div class="resultado">

                    ${partido.golesLocal}
                    -
                    ${partido.golesVisitante}

                </div>

            `;

        } else {

            resultadoHTML = `

                <div class="resultado sin-resultado">

                    VS

                </div>

            `;

        }


        /* ESTADO */

        const estadoHTML =

            tieneResultado

            ? `

                <span class="estado">

                    Finalizado

                </span>

              `

            : `

                <span class="estado proximo">

                    Próximo

                </span>

              `;


        /* IMAGEN LOCAL */

        const imagenLocal =

            escudoLocal

            ? `

                <img
                    class="escudo-partido"
                    src="${escudoLocal}"
                    alt="Escudo de ${local}"
                >

              `

            : "";


        /* IMAGEN VISITANTE */

        const imagenVisitante =

            escudoVisitante

            ? `

                <img
                    class="escudo-partido"
                    src="${escudoVisitante}"
                    alt="Escudo de ${visitante}"
                >

              `

            : "";


        /* TARJETA */

        const tarjeta =
            document.createElement("div");

        tarjeta.className =
            "partido";


        tarjeta.innerHTML = `

            <!-- CABECERA -->

            <div class="cabecera-partido">

                <span class="fecha">

                    Fecha ${partido.fecha || "—"}

                </span>

                ${estadoHTML}

            </div>


            <!-- ENFRENTAMIENTO -->

            <div class="enfrentamiento">


                <!-- LOCAL -->

                <div class="equipo-partido">

                    <a
                        href="equipo.html?v=12&equipo=${encodeURIComponent(local)}&zona=${zonaLocal}"
                    >

                        ${imagenLocal}

                        <div class="nombre-equipo">

                            ${local}

                        </div>

                    </a>

                </div>


                <!-- RESULTADO -->

                ${resultadoHTML}


                <!-- VISITANTE -->

                <div class="equipo-partido">

                    <a
                        href="equipo.html?v=12&equipo=${encodeURIComponent(visitante)}&zona=${zonaVisitante}"
                    >

                        ${imagenVisitante}

                        <div class="nombre-equipo">

                            ${visitante}

                        </div>

                    </a>

                </div>


            </div>


            <!-- INFORMACIÓN -->

            <div class="info-partido">

                <span>

                    📍 Cancha por confirmar

                </span>

                <span>

                    Zona ${zona || "—"}

                </span>

            </div>

        `;


        container.appendChild(tarjeta);

    });

}


/* =====================================================
   FILTROS
===================================================== */

botones.forEach(boton => {

    boton.addEventListener(
        "click",
        () => {

            botones.forEach(b =>
                b.classList.remove("activo")
            );

            boton.classList.add("activo");


            mostrarPartidos(
                boton.dataset.zona
            );

        }
    );

});


/* =====================================================
   ZONA DESDE URL
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );

const zonaURL =
    parametros.get("zona");


if (
    zonaURL &&
    ["A", "B", "C", "D", "E", "F"]
        .includes(zonaURL)
) {

    botones.forEach(boton => {

        boton.classList.remove("activo");

        if (
            boton.dataset.zona === zonaURL
        ) {

            boton.classList.add("activo");

        }

    });


    mostrarPartidos(zonaURL);

} else {

    mostrarPartidos("TODAS");

}

</script>

</body>
</html>
