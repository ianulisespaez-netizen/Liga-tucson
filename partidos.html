  <title>Partidos | Liga Tucson</title>


  <style>

      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #eef3f9;

      color: #16324f;

    }


    /* =========================
       ENCABEZADO
    ========================= */

    .site-header {

      position: sticky;

      top: 0;

      z-index: 1000;

      transition:
        transform 0.35s ease,
        opacity 0.35s ease;

    }


    .site-header.header-hidden {

      transform:
        translateY(-100%);

      opacity: 0;

      pointer-events: none;

    }


    .header-top {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        42px 20px 36px;

      background: #0b1f38;

      text-align: center;

    }


    .header-logo {

      width: 110px;

      height: 110px;

      object-fit: contain;

    }


    /* =========================
       MENÚ
    ========================= */

    .main-nav {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px 24px;

      padding: 18px 20px;

      background: #17365d;

      flex-wrap: wrap;

    }


    .main-nav a {

      display: inline-block;

      color: white;

      text-decoration: none;

      font-size: 20px;

      font-weight: 500;

      padding: 14px 18px;

      border-radius: 10px;

      transition:
        background 0.2s ease,
        color 0.2s ease;

    }


    .main-nav a:hover {

      background: #28527e;

    }


    .main-nav a.active {

      background: #3f7fb8;

      color: white;

    }


    /* =========================
       CONTENEDOR
    ========================= */

    .container {

      max-width: 1200px;

      margin: 0 auto;

      padding:
        45px 20px 70px;

    }


    .page-title {

      text-align: center;

      color: #10243d;

      font-size: 42px;

      font-weight: 800;

      margin-bottom: 10px;

    }


    .page-subtitle {

      text-align: center;

      color: #6c7b88;

      font-size: 20px;

      margin-bottom: 35px;

    }


    /* =========================
       FILTROS
    ========================= */

    .filters-card {

      background: white;

      border-radius: 22px;

      padding: 25px;

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.08);

      margin-bottom: 35px;

    }


    .filters-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;

    }


    .filter-group label {

      display: block;

      margin-bottom: 8px;

      color: #42647d;

      font-size: 14px;

      font-weight: 700;

    }


    .filter-group select {

      width: 100%;

      padding: 14px;

      border:
        2px solid #dce7f0;

      border-radius: 12px;

      background: white;

      color: #16324f;

      font-size: 15px;

      outline: none;

      cursor: pointer;

    }


    .filter-group select:focus {

      border-color: #1684d4;

    }


    /* =========================
       BOTÓN LIMPIAR
    ========================= */

    .clear-button {

      width: 100%;

      margin-top: 18px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #e8f0f7;

      color: #15537e;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease;

    }


    .clear-button:hover {

      background: #d7e7f3;

    }


    /* =========================
       FECHA
    ========================= */

    .date-section {

      margin-bottom: 35px;

    }


    .date-title {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;

      padding:
        18px 22px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #0a3159,
          #1269a8

      color: white;

    }


    .date-title h2 {

      font-size: 24px;

    }


    .match-count {

      font-size: 14px;

      color: #dcecf9;

    }


    /* =========================
       PARTIDOS
    ========================= */

    .matches-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;

    }


    .match-card {

      background: white;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 6px 20px
        rgba(0, 0, 0, 0.07);

      border-left:
        5px solid #258ce0;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    }


    .match-card:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.1);

    }


    .match-card.interzonal {

      border-left-color:
        #d4a600;

    }


    .match-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

    }


    .match-zone {

      padding:
        6px 10px;

      border-radius: 10px;

      background: #e7f2fb;

      color: #14649a;

      font-size: 12px;

      font-weight: 800;

    }


    .match-card.interzonal

      color: #806300;

    }


    .match-status {

      font-size: 12px;

      font-weight: 800;

    }


    .status-finalizado {

      color: #278045;

    }


    .status-programado {

      color: #1474b9;

    }


    .teams {

      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      align-items: center;

      gap: 10px;

    }


    .team {

      display: flex;

      align-items: center;

      gap: 9px;

      min-width: 0;

    }


    .team.home {

      justify-content: flex-end;

      text-align: right;

    }


    .team.away {

      justify-content: flex-start;

      text-align: left;

    }


    .team img {

      width: 46px;

      height: 46px;

      object-fit: contain;

      flex-shrink: 0;

    }


    .team-name {

      font-size: 15px;

      font-weight: 800;

      line-height: 1.2;

    }


    .score {

      min-width: 65px;

      text-align: center;

      font-size: 25px;

      font-weight: 900;

      color: #0b4f82;

    }


    .score.vs {

      font-size: 18px;

      color: #7b8b98;

    }


    .match-bottom {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-top: 18px;

      padding-top: 14px;

      border-top:
        1px solid #edf1f5;

      color: #71808d;

      font-size: 12px;

    }


    /* =========================
       SIN PARTIDOS
    ========================= */

    .empty-card {

      background: white;

      border-radius: 22px;

      padding:
        45px 25px;

      text-align: center;

      box-shadow:
        0 8px 25px

    }


    .empty-card h3 {

      color: #0b4f82;

      margin-bottom: 8px;

    }


    .empty-card p {

      color: #71808d;

    }


    /* =========================
       PLAY-OFF
    ========================= */

    .playoff-link-card {

      margin-top: 40px;

      padding: 28px;

      border-radius: 22px;

      background:

      justify-content: space-between;

      color: #0b4f82;

       FOOTER
    ========================= */

    ========================= */

    @media (max-width: 850px) {

      }

        flex-direction: column;

        align-items: flex-start;

      }


      .playoff-link-card a {

        width: 100%;

        text-align: center;

      }

    }

  <script>

      "Alto Verde":

      "Deportivo Aguilares":

      "San Lorenzo (SA)":

      "Jorge Newbery":

      "Graneros":

      "Santa Ana":

    };


    /* =========================
       ELEMENTOS
    ========================= */

    const filtroFecha =
      document.getElementById(
        "filtroFecha"
      );


    const filtroZona =
      document.getElementById(
        "filtroZona"
      );


    const filtroEquipo =
      document.getElementById(
        "filtroEquipo"
      );


    const filtroEstado =
      document.getElementById(
        "filtroEstado"
      );


    const partidosContainer =
      document.getElementById(
        "partidosContainer"
      );


    /* =========================
       CARGAR FECHAS
    ========================= */

    function cargarFechas() {

      filtroFecha.innerHTML = `

        <option value="TODAS">
          Todas las fechas
        </option>

      `;


      for (
        let fecha = 1;
        fecha <= 14;
        fecha++
      ) {

        filtroFecha.innerHTML += `

          <option value="${fecha}">
            Fecha ${fecha}
          </option>

        `;

      }

    }


    /* =========================
       OBTENER TODOS LOS EQUIPOS
    ========================= */

    function obtenerTodosLosEquipos() {

      const equipos =
        new Set();


      /*
       * datosLiga.zonas contiene
       * directamente los nombres:
       *
       * "Talleres"
       * "Juventud Unida"
       * etc.
       */

      for (
        const zona in datosLiga.zonas
      ) {

        const lista =
          datosLiga.zonas[zona];


        if (
          !Array.isArray(lista)
        ) {

          continue;

        }


        lista.forEach(
          equipo => {

            if (
              typeof equipo ===
              "string"
            ) {

              equipos.add(
                equipo
              );

            }

            else if (
              equipo &&
              typeof equipo.equipo ===
              "string"
            ) {

              equipos.add(
                equipo.equipo
              );

            }

          }
        );

      }


      return Array.from(
        equipos
      ).sort(
        (a, b) =>
          a.localeCompare(
            b,
            "es"
          )
      );

    }


    /* =========================
       CARGAR EQUIPOS
    ========================= */

    function cargarEquipos() {

      filtroEquipo.innerHTML = `

        <option value="TODOS">
          Todos los equipos
        </option>

      `;


      const equipos =
        obtenerTodosLosEquipos();


      equipos.forEach(
        equipo => {

          filtroEquipo.innerHTML += `

            <option
              value="${equipo}"
            >
              ${equipo}
            </option>

          `;

        }
      );

    }


    /* =========================
       PARTIDO PERTENECE A ZONA
    ========================= */

    function partidoPerteneceAZona(
      partido,
      zona
    ) {

      if (
        zona === "TODAS"
      ) {

        return true;

      }


      if (
        zona === "INTERZONAL"
      ) {

        return (
          partido.interzonal === true
        );

      }


      if (
        partido.interzonal === true
      ) {

        return (
          Array.isArray(
            partido.zonas
          ) &&
          partido.zonas.includes(
            zona
          )
        );

      }


      return (
        partido.zona === zona
      );

    }


    /* =========================
       ESTADO DEL PARTIDO
    ========================= */

    function obtenerEstadoPartido(
      partido
    ) {

      const tieneResultado =

        partido.golesLocal !==
          null &&

        partido.golesLocal !==
          undefined &&

        partido.golesVisitante !==
          null &&

        partido.golesVisitante !==
          undefined;


      return tieneResultado
        ? "FINALIZADO"
        : "PROGRAMADO";

    }


    /* =========================
       FILTRAR PARTIDOS
    ========================= */

    function obtenerPartidosFiltrados() {

      if (
        !datosLiga ||
        !Array.isArray(
          datosLiga.partidos
        )
      ) {

        return [];

      }


      return datosLiga.partidos

        .filter(
          partido => {


            /* FECHA */

            if (
              filtroFecha.value !==
              "TODAS"
            ) {

              if (
                Number(
                  partido.fecha
                ) !==
                Number(
                  filtroFecha.value
                )
              ) {

                return false;

              }

            }


            /* ZONA */

            if (
              !partidoPerteneceAZona(
                partido,
                filtroZona.value
              )
            ) {

              return false;

            }


            /* EQUIPO */

            if (
              filtroEquipo.value !==
              "TODOS"
            ) {

              const equipo =
                filtroEquipo.value;


              if (
                partido.local !==
                  equipo &&
                partido.visitante !==
                  equipo
              ) {

                return false;

              }

            }


            /* ESTADO */

            const estado =
              obtenerEstadoPartido(
                partido
              );


            if (
              filtroEstado.value !==
                "TODOS" &&

              estado !==
                filtroEstado.value
            ) {

              return false;

            }


            return true;

          }
        )

        .sort(
          (a, b) => {

            const fechaA =
              Number(
                a.fecha
              );


            const fechaB =
              Number(
                b.fecha
              );


            if (
              fechaA !==
              fechaB
            ) {

              return (
                fechaA -
                fechaB
              );

            }


            return String(
              a.local
            ).localeCompare(
              String(
                b.local
              ),
              "es"
            );

          }
        );

    }


    /* =========================
       CREAR TARJETA DE PARTIDO
    ========================= */

    function crearPartido(
      partido
    ) {

      const estado =
        obtenerEstadoPartido(
          partido
        );


      const finalizado =
        estado ===
        "FINALIZADO";


      const interzonal =
        partido.interzonal === true;


      const escudoLocal =
        escudos[
          partido.local
        ] || "";


      const escudoVisitante =
        escudos[
          partido.visitante
        ] || "";


      let marcador;


      if (
        finalizado
      ) {

        marcador = `

          <div class="score">

            ${partido.golesLocal}
            -
            ${partido.golesVisitante}

          </div>

        `;

      }

      else {

        marcador = `

          <div class="score vs">

            VS

          </div>

        `;

      }


      const etiquetaZona =
        interzonal

          ? "Interzonal"

          : "Zona " +
            partido.zona;


      const textoEstado =
        finalizado

          ? "Finalizado"

          : "Programado";


      const zonasInterzonal =
        Array.isArray(
          partido.zonas
        )
          ? partido.zonas.join(
              " / "
            )
          : "";


      const detalleZona =
        interzonal

          ? zonasInterzonal

          : (
              "Zona " +
              partido.zona
            );


      return `

        <article
          class="match-card ${
            interzonal
              ? "interzonal"
              : ""
          }"
        >


          <div class="match-top">


            <span class="match-zone">

              ${etiquetaZona}

            </span>


            <span
              class="match-status ${
                finalizado
                  ? "status-finalizado"
                  : "status-programado"
              }"
            >

              ${textoEstado}

            </span>


          </div>


          <div class="teams">


            <!-- LOCAL -->

            <div class="team home">


              <span class="team-name">

                ${partido.local}

              </span>


              ${
                escudoLocal
                  ? `

                    <img
                      src="${escudoLocal}"
                      alt="${partido.local}"
                    >

                  `
                  : ""
              }


            </div>


            <!-- MARCADOR -->

            ${marcador}


            <!-- VISITANTE -->

            <div class="team away">


              ${
                escudoVisitante
                  ? `

                    <img
                      src="${escudoVisitante}"
                      alt="${partido.visitante}"
                    >

                  `
                  : ""
              }


              <span class="team-name">

                ${partido.visitante}

              </span>


            </div>


          </div>


          <div class="match-bottom">


            <span>

              Fecha ${partido.fecha}

            </span>


            <span>

              ${detalleZona}

            </span>


          </div>


        </article>

      `;

    }


    /* =========================
       MOSTRAR PARTIDOS
    ========================= */

    function mostrarPartidos() {

      const partidos =
        obtenerPartidosFiltrados();


      if (
        partidos.length === 0
      ) {

        partidosContainer.innerHTML = `

          <div class="empty-card">

            <h3>
              No hay partidos
            </h3>

            <p>
              No encontramos partidos
              con los filtros seleccionados.
            </p>

          </div>

        `;

        return;

      }


      const porFecha = {};


      partidos.forEach(
        partido => {

          const fecha =
            partido.fecha;


          if (
            !porFecha[fecha]
          ) {

            porFecha[fecha] = [];

          }


          porFecha[fecha].push(
            partido
          );

        }
      );


      partidosContainer.innerHTML =

        Object.keys(
          porFecha
        )

        .sort(
          (a, b) =>
            Number(a) -
            Number(b)
        )

        .map(
          fecha => {

            const partidosFecha =
              porFecha[fecha];


            return `

              <section
                class="date-section"
              >


                <div
                  class="date-title"
                >

                  <h2>

                    Fecha ${fecha}

                  </h2>


                  <span
                    class="match-count"
                  >

                    ${
                      partidosFecha.length
                    }

                    ${
                      partidosFecha.length === 1
                        ? "partido"
                        : "partidos"
                    }

                  </span>


                </div>


                <div
                  class="matches-grid"
                >

                  ${
                    partidosFecha
                      .map(
                        crearPartido
                      )
                      .join("")
                  }

                </div>


              </section>

            `;

          }
        )

        .join("");

    }


    /* =========================
       LIMPIAR FILTROS
    ========================= */

    function limpiarFiltros() {

      filtroFecha.value =
        "TODAS";


      filtroZona.value =
        "TODAS";


      filtroEquipo.value =
        "TODOS";


      filtroEstado.value =
        "TODOS";


      mostrarPartidos();

    }


    /* =========================
       EVENTOS
    ========================= */

    filtroFecha.addEventListener(
      "change",
      mostrarPartidos
    );


    filtroZona.addEventListener(
      "change",
      mostrarPartidos
    );


    filtroEquipo.addEventListener(
      "change",
      mostrarPartidos
    );


    filtroEstado.addEventListener(
      "change",
      mostrarPartidos
    );


    /* =========================
       MENÚ AL DESPLAZARSE
    ========================= */

    let ultimaPosicion =
      window.scrollY;


    const header =
      document.getElementById(
        "siteHeader"
      );


    window.addEventListener(
      "scroll",
      function() {

        const posicionActual =
          window.scrollY;


        if (
          posicionActual <= 10
        ) {

          header.classList.remove(
            "header-hidden"
          );

        }

        else if (
          posicionActual >
          ultimaPosicion
        ) {

          header.classList.add(
            "header-hidden"
          );

        }

        else if (
          posicionActual <
          ultimaPosicion
        ) {

          header.classList.remove(
            "header-hidden"
          );

        }


        ultimaPosicion =
          posicionActual;

      },
      {
        passive: true
      }
    );


    /* =========================
       INICIAR
    ========================= */

    cargarFechas();

    cargarEquipos();

    mostrarPartidos();

  </script>


</body>

</html>
