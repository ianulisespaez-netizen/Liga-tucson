<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partidos | Liga Tucson</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fa;
    color: #102a43;
}

/* =========================
   HEADER
========================= */

header {
    background: #061a33;
    color: white;
    padding: 15px 20px;
}

.header-contenido {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.titulo {
    flex: 1;
}

.titulo h1 {
    margin: 0;
    font-size: 25px;
}

.titulo p {
    margin: 4px 0 0;
    color: #8bdcff;
    font-size: 13px;
}

/* =========================
   NAVEGACIÓN
========================= */

nav {
    background: #0b3158;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
}

nav a:hover {
    color: #7edcff;
}

/* =========================
   CONTENIDO
========================= */

.contenedor {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

h2 {
    color: #061a33;
}

/* =========================
   FILTROS
========================= */

.filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0 30px;
}

.filtro {
    border: none;
    background: #dcecf7;
    color: #061a33;
    padding: 10px 17px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.filtro:hover {
    background: #b9def2;
}

.filtro.activo {
    background: #087ec4;
    color: white;
}

/* =========================
   PARTIDO
========================= */

.partidos {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.partido {
    background: white;
    border-radius: 15px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.cabecera-partido {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    color: #617386;
    font-size: 13px;
}

.fecha {
    font-weight: bold;
}

.estado {
    background: #dff5e8;
    color: #177245;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
}

.estado.proximo {
    background: #e1f0fa;
    color: #087ec4;
}

/* =========================
   EQUIPOS DEL PARTIDO
========================= */

.enfrentamiento {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 15px;
}

.equipo-partido {
    display: flex;
    align-items: center;
    gap: 12px;
}

.equipo-partido.local {
    justify-content: flex-end;
    text-align: right;
}

.equipo-partido.visitante {
    justify-content: flex-start;
    text-align: left;
}

.escudo-partido {
    width: 55px;
    height: 55px;
    object-fit: contain;
    flex-shrink: 0;
}

.nombre-equipo {
    color: #102a43;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
}

.nombre-equipo:hover {
    color: #087ec4;
}

.resultado {
    font-size: 22px;
    font-weight: bold;
    color: #061a33;
    min-width: 65px;
    text-align: center;
}

.sin-resultado {
    font-size: 14px;
    color: #789;
}

/* =========================
   INFORMACIÓN
========================= */

.info-partido {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #e5edf3;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    color: #617386;
    font-size: 13px;
}

/* =========================
   SIN PARTIDOS
========================= */

.sin-partidos {
    background: white;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    color: #789;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 40px;
    background: #061a33;
    color: white;
    text-align: center;
    padding: 20px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .header-contenido {
        flex-direction: column;
        text-align: center;
    }

    nav a {
        display: inline-block;
        margin: 5px 7px;
    }

    .enfrentamiento {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .equipo-partido.local,
    .equipo-partido.visitante {
        justify-content: center;
        text-align: center;
    }

    .resultado {
        order: 2;
    }

    .equipo-partido.local {
        order: 1;
    }

    .equipo-partido.visitante {
        order: 3;
    }

    .cabecera-partido {
        flex-direction: column;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-contenido">

        <img
            class="logo"
            src="https://raw.githubusercontent.com/ianulisespaez-netizen/Liga-tucson/main/FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
            alt="Liga Tucson"
        >

        <div class="titulo">

            <h1>⚽ LIGA TUCSON</h1>

            <p>
                Primera División A - Clausura 2026
            </p>

        </div>

    </div>

</header>


<nav>

    <a href="index.html">Inicio</a>
    <a href="posiciones.html">Posiciones</a>
    <a href="partidos.html">Partidos</a>
    <a href="equipos.html">Equipos</a>

</nav>


<div class="contenedor">

    <h2>⚽ Partidos</h2>

    <div class="filtros">

        <button class="filtro activo" data-zona="TODAS">
            Todas
        </button>

        <button class="filtro" data-zona="A">
            Zona A
        </button>

        <button class="filtro" data-zona="B">
            Zona B
        </button>

        <button class="filtro" data-zona="C">
            Zona C
        </button>

        <button class="filtro" data-zona="D">
            Zona D
        </button>

        <button class="filtro" data-zona="E">
            Zona E
        </button>

        <button class="filtro" data-zona="F">
            Zona F
        </button>

    </div>


    <div id="partidos-container" class="partidos"></div>

</div>


<footer>

    Liga Tucson © 2026

</footer>


<script src="datos.js"></script>


<script>

/* =====================================================
   ESCUDOS
===================================================== */

const escudos = {

    /* ZONA A */

    "Talleres": "IMG_1621.png",
    "Juventud Unida": "IMG_1622.png",
    "Estación Experimental": "IMG_1623.png",
    "Central Norte": "21B48DFD-98C8-4EDD-B633-35738F9B089D.png",
    "Villa Mitre": "IMG_1625.jpeg",
    "All Boys": "IMG_1627.png",
    "San José": "IMG_1628.png",

    /* ZONA B */

    "Argentinos del Norte": "IMG_1629.png",
    "San Martín": "IMG_1630.png",
    "San Antonio": "IMG_1631.jpeg",
    "Atlético Tucumán": "IMG_1632.jpeg",
    "Sportivo Guzmán": "IMG_1633.png",
    "Amalia": "IMG_1634.png",
    "Tucumán Central": "IMG_1635.png",

    /* ZONA C */

    "Garmendia": "IMG_1637.jpeg",
    "Atlético Concepción": "IMG_1638.png",
    "San Juan": "9D389031-3751-4B06-A800-AE5B7A426605.png",
    "San Lorenzo (DG)": "IMG_1646.png",
    "Unión del Norte": "IMG_1641.jpeg",
    "Lastenia": "IMG_1645.png",
    "Cruz Alta": "IMG_1644.png",

    /* ZONA D */

    "Bella Vista": "IMG_1651.png",
    "San Fernando": "IMG_1652.png",
    "Almirante Brown": "IMG_1653.jpeg",
    "Famaillá": "IMG_1654.png",
    "Ateneo Parroquial Alderetes": "IMG_1655.png",
    "Santa Lucía": "IMG_1656.jpeg",
    "San Pablo": "IMG_1671.png",

    /* ZONA E */

    "Alto Verde": "IMG_1657.png",
    "Concepción FC": "IMG_1658.png",
    "Azucarera Argentina": "IMG_1659.png",
    "Ñuñorco": "IMG_1660.png",
    "Unión Simoca": "IMG_1661.jpeg",
    "San Ramón": "IMG_1662.jpeg",
    "Santa Rosa": "IMG_1663.png",
    "La Providencia": "IMG_1664.jpeg",

    /* ZONA F */

    "Deportivo Aguilares": "IMG_1665.png",
    "San Lorenzo (SA)": "IMG_1666.webp",
    "Jorge Newbery": "IMG_1673.png",
    "Graneros": "IMG_1667.jpeg",
    "Santa Ana": "IMG_1668.png",
    "Trinidad": "IMG_1669.png",
    "Marapa": "IMG_1670.jpeg",
    "Llorens": "IMG_1672.jpeg"

};


/* =====================================================
   CONTENEDOR
===================================================== */

const container =
    document.getElementById("partidos-container");

const botones =
    document.querySelectorAll(".filtro");


/* =====================================================
   OBTENER ZONA DE UN EQUIPO
===================================================== */

function obtenerZonaEquipo(nombre) {

    for (const zona of ["A", "B", "C", "D", "E", "F"]) {

        const equipos =
            datosLiga.zonas[zona];

        if (!equipos) continue;

        const encontrado =
            equipos.find(e => e.equipo === nombre);

        if (encontrado) {
            return zona;
        }
    }

    return "";
}


/* =====================================================
   MOSTRAR PARTIDOS
===================================================== */

function mostrarPartidos(zonaSeleccionada = "TODAS") {

    container.innerHTML = "";

    let partidos =
        datosLiga.partidos || [];


    /* Filtrar zona */

    if (zonaSeleccionada !== "TODAS") {

        partidos =
            partidos.filter(partido => {

                const zonaLocal =
                    obtenerZonaEquipo(partido.local);

                const zonaVisitante =
                    obtenerZonaEquipo(partido.visitante);

                return (
                    zonaLocal === zonaSeleccionada ||
                    zonaVisitante === zonaSeleccionada
                );

            });

    }


    /* Sin partidos */

    if (partidos.length === 0) {

        container.innerHTML = `

            <div class="sin-partidos">

                No hay partidos cargados
                para esta zona.

            </div>

        `;

        return;
    }


    /* Crear partidos */

    partidos.forEach(partido => {


        const local =
            partido.local;

        const visitante =
            partido.visitante;


        const zona =
            obtenerZonaEquipo(local);


        const escudoLocal =
            escudos[local];

        const escudoVisitante =
            escudos[visitante];


        /* Determinar estado */

        const tieneResultado =
            partido.golesLocal !== undefined &&
            partido.golesLocal !== null &&
            partido.golesVisitante !== undefined &&
            partido.golesVisitante !== null;


        let resultadoHTML;


        if (tieneResultado) {

            resultadoHTML = `

                <div class="resultado">

                    ${partido.golesLocal}
                    -
                    ${partido.golesVisitante}

                </div>

            `;

        } else {

            resultadoHTML = `

                <div class="resultado sin-resultado">

                    VS

                </div>

            `;

        }


        const estadoHTML =
            tieneResultado

                ? `
                    <span class="estado">
                        Finalizado
                    </span>
                  `

                : `
                    <span class="estado proximo">
                        Próximo
                    </span>
                  `;


        /* Escudos */

        const imagenLocal =
            escudoLocal

                ? `
                    <img
                        class="escudo-partido"
                        src="${escudoLocal}"
                        alt="Escudo de ${local}"
                    >
                  `

                : "";


        const imagenVisitante =
            escudoVisitante

                ? `
                    <img
                        class="escudo-partido"
                        src="${escudoVisitante}"
                        alt="Escudo de ${visitante}"
                    >
                  `

                : "";


        /* Tarjeta */

        const tarjeta =
            document.createElement("div");

        tarjeta.className =
            "partido";


        tarjeta.innerHTML = `

            <div class="cabecera-partido">

                <span class="fecha">

                    ${partido.fecha || "Fecha por confirmar"}

                </span>

                ${estadoHTML}

            </div>


            <div class="enfrentamiento">


                <div class="equipo-partido local">

                    <a
                        class="nombre-equipo"
                        href="equipo.html?v=11&equipo=${encodeURIComponent(local)}&zona=${zona}"
                    >
                        ${local}
                    </a>

                    ${imagenLocal}

                </div>


                ${resultadoHTML}


                <div class="equipo-partido visitante">

                    ${imagenVisitante}

                    <a
                        class="nombre-equipo"
                        href="equipo.html?v=11&equipo=${encodeURIComponent(visitante)}&zona=${obtenerZonaEquipo(visitante)}"
                    >
                        ${visitante}
                    </a>

                </div>

            </div>


            <div class="info-partido">

                <span>
                    📍 ${partido.cancha || "Cancha por confirmar"}
                </span>

                <span>
                    Zona ${zona || "—"}
                </span>

            </div>

        `;


        container.appendChild(tarjeta);

    });

}


/* =====================================================
   BOTONES
===================================================== */

botones.forEach(boton => {

    boton.addEventListener("click", () => {

        botones.forEach(b =>
            b.classList.remove("activo")
        );

        boton.classList.add("activo");


        mostrarPartidos(
            boton.dataset.zona
        );

    });

});


/* =====================================================
   ZONA DESDE URL
===================================================== */

const parametros =
    new URLSearchParams(window.location.search);

const zonaURL =
    parametros.get("zona");


if (
    zonaURL &&
    ["A", "B", "C", "D", "E", "F"].includes(zonaURL)
) {

    botones.forEach(boton => {

        boton.classList.remove("activo");

        if (boton.dataset.zona === zonaURL) {
            boton.classList.add("activo");
        }

    });

    mostrarPartidos(zonaURL);

} else {

    mostrarPartidos("TODAS");

}

</script>

</body>
</html>
