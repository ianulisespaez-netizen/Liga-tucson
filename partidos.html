<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Partidos - Liga Tucson</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172f55;
        }

        header {
            background: linear-gradient(135deg, #173d6b, #4d86bd);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            padding: 25px 18px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            color: #173d6b;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
        }

        .titulo {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.07);
        }

        .titulo h2 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .titulo p {
            margin: 0;
            color: #687891;
            font-size: 18px;
        }

        .filtros {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.07);

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .filtro label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .filtro select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4dce7;
            border-radius: 10px;
            background: white;
            color: #172f55;
            font-size: 16px;
        }

        .zona {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.07);
        }

        .zona h2 {
            margin-top: 0;
            font-size: 27px;
            border-left: 7px solid #4ca0d8;
            padding-left: 12px;
        }

        .partido {
            background: #f1f5f9;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .partido:last-child {
            margin-bottom: 0;
        }

        .fecha {
            color: #687891;
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .equipos-partido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .equipo {
            width: 40%;
            font-size: 17px;
            font-weight: bold;
        }

        .local {
            text-align: right;
        }

        .visitante {
            text-align: left;
        }

        .equipo a {
            color: #173d6b;
            text-decoration: none;
        }

        .equipo a:hover {
            color: #4ca0d8;
        }

        .resultado {
            min-width: 80px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #173d6b;
        }

        .estado {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        .finalizado {
            color: #16803c;
        }

        .proximo {
            color: #2878b8;
        }

        .sin-partidos {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 30px;
            color: #687891;
        }

        .boton-limpiar {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: #173d6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            .filtros {
                grid-template-columns: 1fr;
            }

            .zona {
                padding: 18px;
            }

            .zona h2 {
                font-size: 24px;
            }

            .equipo {
                font-size: 14px;
            }

            .resultado {
                min-width: 60px;
                font-size: 19px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>⚽ LIGA TUCSON</h1>

</header>


<div class="contenedor">


    <a href="index.html" class="volver">
        ← Volver al inicio
    </a>


    <div class="titulo">

        <h2>Partidos</h2>

        <p>
            Primera División A - Clausura 2026
        </p>

    </div>


    <!-- ============================== -->
    <!-- FILTROS -->
    <!-- ============================== -->

    <div class="filtros">


        <div class="filtro">

            <label for="filtroZona">
                Zona
            </label>

            <select id="filtroZona">

                <option value="todas">
                    Todas las zonas
                </option>

                <option value="A">
                    Zona A
                </option>

                <option value="B">
                    Zona B
                </option>

                <option value="C">
                    Zona C
                </option>

                <option value="D">
                    Zona D
                </option>

                <option value="E">
                    Zona E
                </option>

                <option value="F">
                    Zona F
                </option>

            </select>

        </div>


        <div class="filtro">

            <label for="filtroFecha">
                Fecha
            </label>

            <select id="filtroFecha">

                <option value="todas">
                    Todas las fechas
                </option>

            </select>

        </div>


    </div>


    <div id="partidos">

        <div class="sin-partidos">
            Cargando partidos...
        </div>

    </div>


</div>


<script src="datos.js"></script>


<script>


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const contenedor =
        document.getElementById("partidos");

    const filtroZona =
        document.getElementById("filtroZona");

    const filtroFecha =
        document.getElementById("filtroFecha");


    // ==========================================
    // CARGAR FECHAS DISPONIBLES
    // ==========================================

    function cargarFechas() {

        const fechas = [];

        datosLiga.partidos.forEach(partido => {

            const fecha =
                partido.fecha || "Fecha 5";

            if (!fechas.includes(fecha)) {

                fechas.push(fecha);

            }

        });


        fechas.sort((a, b) => {

            const numeroA =
                parseInt(a.replace(/\D/g, "")) || 0;

            const numeroB =
                parseInt(b.replace(/\D/g, "")) || 0;

            return numeroA - numeroB;

        });


        fechas.forEach(fecha => {

            const opcion =
                document.createElement("option");

            opcion.value = fecha;

            opcion.textContent = fecha;

            filtroFecha.appendChild(opcion);

        });

    }


    // ==========================================
    // CREAR ENLACE DEL EQUIPO
    // ==========================================

    function enlaceEquipo(nombre, zona) {

        return `

            <a href="equipo.html?v=3&equipo=${encodeURIComponent(nombre)}&zona=${encodeURIComponent(zona)}">

                ${nombre}

            </a>

        `;

    }


    // ==========================================
    // MOSTRAR PARTIDOS
    // ==========================================

    function mostrarPartidos() {


        const zonaSeleccionada =
            filtroZona.value;

        const fechaSeleccionada =
            filtroFecha.value;


        let partidosFiltrados =
            datosLiga.partidos.filter(partido => {


                const coincideZona =

                    zonaSeleccionada === "todas"

                    ||

                    partido.zona === zonaSeleccionada;


                const fecha =
                    partido.fecha || "Fecha 5";


                const coincideFecha =

                    fechaSeleccionada === "todas"

                    ||

                    fecha === fechaSeleccionada;


                return coincideZona &&
                       coincideFecha;

            });


        if (partidosFiltrados.length === 0) {

            contenedor.innerHTML = `

                <div class="sin-partidos">

                    No hay partidos cargados
                    para los filtros seleccionados.

                </div>

            `;

            return;

        }


        // ======================================
        // AGRUPAR POR ZONA
        // ======================================

        const zonas = {};


        partidosFiltrados.forEach(partido => {

            const zona =
                partido.zona || "Sin zona";


            if (!zonas[zona]) {

                zonas[zona] = [];

            }


            zonas[zona].push(partido);

        });


        let contenido = "";


        Object.keys(zonas)
            .sort()
            .forEach(zona => {


                contenido += `

                    <div class="zona">

                        <h2>
                            Zona ${zona}
                        </h2>

                `;


                zonas[zona].forEach(partido => {


                    const tieneResultado =

                        partido.resultado &&
                        partido.resultado !== "-";


                    contenido += `

                        <div class="partido">


                            <div class="fecha">

                                ${partido.fecha || "Fecha 5"}

                            </div>


                            <div class="equipos-partido">


                                <div class="equipo local">

                                    ${enlaceEquipo(
                                        partido.local,
                                        zona
                                    )}

                                </div>


                                <div class="resultado">

                                    ${
                                        tieneResultado
                                        ? partido.resultado
                                        : "VS"
                                    }

                                </div>


                                <div class="equipo visitante">

                                    ${enlaceEquipo(
                                        partido.visitante,
                                        zona
                                    )}

                                </div>


                            </div>


                            <div class="estado ${
                                tieneResultado
                                ? "finalizado"
                                : "proximo"
                            }">

                                ${
                                    tieneResultado
                                    ? "✓ FINALIZADO"
                                    : "◷ PRÓXIMO PARTIDO"
                                }

                            </div>


                        </div>

                    `;

                });


                contenido += `

                    </div>

                `;

            });


        contenedor.innerHTML = contenido;

    }


    // ==========================================
    // CAMBIAR FILTRO
    // ==========================================

    filtroZona.addEventListener(
        "change",
        mostrarPartidos
    );


    filtroFecha.addEventListener(
        "change",
        mostrarPartidos
    );


    // ==========================================
    // INICIAR
    // ==========================================

    cargarFechas();

    mostrarPartidos();


</script>


</body>

</html>
