<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Partidos - Liga Tucson</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172f55;
        }

        header {
            background: linear-gradient(135deg, #173d6b, #4d86bd);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            padding: 25px 18px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            color: #173d6b;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
        }

        .titulo {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.07);
        }

        .titulo h2 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .titulo p {
            margin: 0;
            color: #687891;
            font-size: 18px;
        }

        .zona {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.07);
        }

        .zona h2 {
            margin-top: 0;
            font-size: 27px;
            border-left: 7px solid #4ca0d8;
            padding-left: 12px;
        }

        .partido {
            background: #f1f5f9;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .partido:last-child {
            margin-bottom: 0;
        }

        .fecha {
            color: #687891;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .equipos-partido {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .equipo {
            width: 40%;
            font-size: 17px;
            font-weight: bold;
        }

        .local {
            text-align: right;
        }

        .visitante {
            text-align: left;
        }

        .resultado {
            min-width: 90px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #173d6b;
        }

        .estado {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        .finalizado {
            color: #16803c;
        }

        .proximo {
            color: #2878b8;
        }

        .sin-partidos {
            text-align: center;
            color: #687891;
            padding: 15px;
        }

        @media (max-width: 600px) {

            .zona {
                padding: 18px;
            }

            .zona h2 {
                font-size: 24px;
            }

            .equipos-partido {
                gap: 8px;
            }

            .equipo {
                font-size: 15px;
            }

            .resultado {
                min-width: 65px;
                font-size: 19px;
            }

        }

    </style>

</head>


<body>

<header>

    <h1>⚽ LIGA TUCSON</h1>

</header>


<div class="contenedor">

    <a href="index.html" class="volver">
        ← Volver al inicio
    </a>


    <div class="titulo">

        <h2>Partidos</h2>

        <p>
            Primera División A - Clausura 2026
        </p>

    </div>


    <div id="partidos">

        <div class="sin-partidos">
            Cargando partidos...
        </div>

    </div>

</div>


<!-- DATOS DE LA LIGA -->

<script src="datos.js"></script>


<script>

    const contenedor = document.getElementById("partidos");


    // ==========================================
    // ZONAS
    // ==========================================

    const zonas = ["A", "B", "C", "D", "E", "F"];


    let contenido = "";


    // ==========================================
    // RECORRER TODAS LAS ZONAS
    // ==========================================

    zonas.forEach(zona => {


        const partidosZona = datosLiga.partidos.filter(partido => {

            return partido.zona === zona;

        });


        // Si no hay partidos cargados para esa zona
        if (partidosZona.length === 0) {

            return;

        }


        contenido += `

            <div class="zona">

                <h2>
                    Zona ${zona}
                </h2>

        `;


        // ======================================
        // MOSTRAR PARTIDOS
        // ======================================

        partidosZona.forEach(partido => {


            const tieneResultado =
                partido.resultado &&
                partido.resultado !== "-";


            contenido += `

                <div class="partido">


                    <div class="fecha">

                        ${partido.fecha || "Fecha 5"}

                    </div>


                    <div class="equipos-partido">


                        <div class="equipo local">

                            ${partido.local}

                        </div>


                        <div class="resultado">

                            ${
                                tieneResultado
                                ? partido.resultado
                                : "VS"
                            }

                        </div>


                        <div class="equipo visitante">

                            ${partido.visitante}

                        </div>


                    </div>


                    <div class="estado ${tieneResultado ? "finalizado" : "proximo"}">

                        ${
                            tieneResultado
                            ? "✓ FINALIZADO"
                            : "◷ PRÓXIMO PARTIDO"
                        }

                    </div>


                </div>

            `;

        });


        contenido += `

            </div>

        `;

    });


    // ==========================================
    // MOSTRAR TODO
    // ==========================================

    if (contenido === "") {

        contenedor.innerHTML = `

            <div class="sin-partidos">

                Todavía no hay partidos cargados.

            </div>

        `;

    } else {

        contenedor.innerHTML = contenido;

    }

</script>


</body>

</html>
