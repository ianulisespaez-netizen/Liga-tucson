<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Posiciones | Liga Tucson</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fa;
    color: #102a43;
}

/* =========================
   HEADER
========================= */

header {
    background: #061a33;
    color: white;
    padding: 15px 20px;
}

.header-contenido {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.titulo {
    flex: 1;
}

.titulo h1 {
    margin: 0;
    font-size: 25px;
}

.titulo p {
    margin: 4px 0 0;
    color: #8bdcff;
    font-size: 13px;
}

/* =========================
   NAVEGACIÓN
========================= */

nav {
    background: #0b3158;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
}

nav a:hover {
    color: #7edcff;
}

/* =========================
   CONTENIDO
========================= */

.contenedor {
    max-width: 1150px;
    margin: auto;
    padding: 25px 15px;
}

h2 {
    color: #061a33;
}

/* =========================
   BOTONES DE ZONA
========================= */

.filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0 30px;
}

.filtro {
    border: none;
    background: #dcecf7;
    color: #061a33;
    padding: 10px 17px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.filtro:hover {
    background: #b9def2;
}

.filtro.activo {
    background: #087ec4;
    color: white;
}

/* =========================
   TABLA
========================= */

.tabla-contenedor {
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

thead {
    background: #061a33;
    color: white;
}

th {
    padding: 13px 8px;
    font-size: 13px;
    white-space: nowrap;
}

td {
    padding: 11px 8px;
    text-align: center;
    border-bottom: 1px solid #e5edf3;
    font-size: 14px;
}

tbody tr:hover {
    background: #f2f8fc;
}

/* =========================
   POSICIÓN
========================= */

.posicion {
    font-weight: bold;
    width: 45px;
}

/* =========================
   EQUIPO
========================= */

.equipo-celda {
    text-align: left;
    min-width: 230px;
}

.equipo-link {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #102a43;
    text-decoration: none;
    font-weight: bold;
}

.equipo-link:hover {
    color: #087ec4;
}

.escudo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

/* =========================
   PUNTOS
========================= */

.puntos {
    font-weight: bold;
    color: #087ec4;
    font-size: 16px;
}

/* =========================
   DESTACADOS
========================= */

.puesto-1 {
    background: #f7f1d4;
}

.puesto-2 {
    background: #eeeeee;
}

.puesto-3 {
    background: #f5e4d5;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 40px;
    background: #061a33;
    color: white;
    text-align: center;
    padding: 20px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .header-contenido {
        flex-direction: column;
        text-align: center;
    }

    nav a {
        display: inline-block;
        margin: 5px 7px;
    }

    .filtros {
        justify-content: center;
    }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-contenido">

        <img
            class="logo"
            src="https://raw.githubusercontent.com/ianulisespaez-netizen/Liga-tucson/main/FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
            alt="Liga Tucson"
        >

        <div class="titulo">

            <h1>⚽ LIGA TUCSON</h1>

            <p>
                Primera División A - Clausura 2026
            </p>

        </div>

    </div>

</header>


<!-- =========================
     NAVEGACIÓN
========================= -->

<nav>

    <a href="index.html">Inicio</a>

    <a href="posiciones.html">Posiciones</a>

    <a href="partidos.html">Partidos</a>

    <a href="equipos.html">Equipos</a>

</nav>


<!-- =========================
     CONTENIDO
========================= -->

<div class="contenedor">

    <h2>🏆 Tabla de posiciones</h2>

    <div class="filtros">

        <button class="filtro" data-zona="A">
            Zona A
        </button>

        <button class="filtro" data-zona="B">
            Zona B
        </button>

        <button class="filtro" data-zona="C">
            Zona C
        </button>

        <button class="filtro" data-zona="D">
            Zona D
        </button>

        <button class="filtro" data-zona="E">
            Zona E
        </button>

        <button class="filtro" data-zona="F">
            Zona F
        </button>

    </div>


    <div class="tabla-contenedor">

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>Equipo</th>

                    <th>PJ</th>

                    <th>PG</th>

                    <th>PE</th>

                    <th>PP</th>

                    <th>GF</th>

                    <th>GC</th>

                    <th>DG</th>

                    <th>PTS</th>

                </tr>

            </thead>

            <tbody id="tabla-posiciones">

            </tbody>

        </table>

    </div>

</div>


<footer>

    Liga Tucson © 2026

</footer>


<script src="datos.js"></script>


<script>

/* =====================================================
   ESCUDOS
===================================================== */

const escudos = {

    // ZONA A

    "Talleres": "IMG_1621.png",
    "Juventud Unida": "IMG_1622.png",
    "Estación Experimental": "IMG_1623.png",
    "Central Norte": "21B48DFD-98C8-4EDD-B633-35738F9B089D.png",
    "Villa Mitre": "IMG_1625.jpeg",
    "All Boys": "IMG_1627.png",
    "San José": "IMG_1628.png",


    // ZONA B

    "Argentinos del Norte": "IMG_1629.png",
    "San Martín": "IMG_1630.png",
    "San Antonio": "IMG_1631.jpeg",
    "Atlético Tucumán": "IMG_1632.jpeg",
    "Sportivo Guzmán": "IMG_1633.png",
    "Amalia": "IMG_1634.png",
    "Tucumán Central": "IMG_1635.png",


    // ZONA C

    "Garmendia": "IMG_1637.jpeg",
    "Atlético Concepción": "IMG_1638.png",
    "San Juan": "9D389031-3751-4B06-A800-AE5B7A426605.png",
    "San Lorenzo (DG)": "IMG_1646.png",
    "Unión del Norte": "IMG_1641.jpeg",
    "Lastenia": "IMG_1645.png",
    "Cruz Alta": "IMG_1644.png",


    // ZONA D

    "Bella Vista": "IMG_1651.png",
    "San Fernando": "IMG_1652.png",
    "Almirante Brown": "IMG_1653.jpeg",
    "Famaillá": "IMG_1654.png",
    "Ateneo Parroquial Alderetes": "IMG_1655.png",
    "Santa Lucía": "IMG_1656.jpeg",
    "San Pablo": "IMG_1671.png",


    // ZONA E

    "Alto Verde": "IMG_1657.png",
    "Concepción FC": "IMG_1658.png",
    "Azucarera Argentina": "IMG_1659.png",
    "Ñuñorco": "IMG_1660.png",
    "Unión Simoca": "IMG_1661.jpeg",
    "San Ramón": "IMG_1662.jpeg",
    "Santa Rosa": "IMG_1663.png",
    "La Providencia": "IMG_1664.jpeg",


    // ZONA F

    "Deportivo Aguilares": "IMG_1665.png",
    "San Lorenzo (SA)": "IMG_1666.webp",
    "Jorge Newbery": "IMG_1673.png",
    "Graneros": "IMG_1667.jpeg",
    "Santa Ana": "IMG_1668.png",
    "Trinidad": "IMG_1669.png",
    "Marapa": "IMG_1670.jpeg",
    "Llorens": "IMG_1672.jpeg"

};


/* =====================================================
   TABLA
===================================================== */

const tabla =
    document.getElementById("tabla-posiciones");

const botones =
    document.querySelectorAll(".filtro");


/* =====================================================
   MOSTRAR TABLA
===================================================== */

function mostrarTabla(zona) {

    tabla.innerHTML = "";

    let equipos =
        datosLiga.zonas[zona];

    if (!equipos) {
        return;
    }


    /* Copia para no modificar datosLiga */

    equipos = [...equipos];


    /* Calcular puntos */

    equipos.forEach(equipo => {

        equipo._puntos =
            (Number(equipo.pg) * 3) +
            Number(equipo.pe);

    });


    /* Ordenar */

    equipos.sort((a, b) => {

        if (b._puntos !== a._puntos) {
            return b._puntos - a._puntos;
        }

        if (b.dg !== a.dg) {
            return b.dg - a.dg;
        }

        return b.gf - a.gf;

    });


    /* Crear filas */

    equipos.forEach((equipo, index) => {

        const posicion =
            index + 1;

        const nombre =
            equipo.equipo;

        const escudo =
            escudos[nombre];


        const fila =
            document.createElement("tr");


        if (posicion === 1) {
            fila.classList.add("puesto-1");
        }

        if (posicion === 2) {
            fila.classList.add("puesto-2");
        }

        if (posicion === 3) {
            fila.classList.add("puesto-3");
        }


        let escudoHTML = "";

        if (escudo) {

            escudoHTML = `

                <img
                    class="escudo"
                    src="${escudo}"
                    alt="Escudo de ${nombre}"
                >

            `;

        }


        fila.innerHTML = `

            <td class="posicion">
                ${posicion}
            </td>

            <td class="equipo-celda">

                <a
                    class="equipo-link"
                    href="equipo.html?v=10&equipo=${encodeURIComponent(nombre)}&zona=${zona}"
                >

                    ${escudoHTML}

                    <span>
                        ${nombre}
                    </span>

                </a>

            </td>

            <td>${equipo.pj}</td>

            <td>${equipo.pg}</td>

            <td>${equipo.pe}</td>

            <td>${equipo.pp}</td>

            <td>${equipo.gf}</td>

            <td>${equipo.gc}</td>

            <td>${equipo.dg}</td>

            <td class="puntos">
                ${equipo._puntos}
            </td>

        `;


        tabla.appendChild(fila);

    });

}


/* =====================================================
   BOTONES
===================================================== */

botones.forEach(boton => {

    boton.addEventListener("click", () => {

        botones.forEach(b =>
            b.classList.remove("activo")
        );

        boton.classList.add("activo");

        mostrarTabla(
            boton.dataset.zona
        );

    });

});


/* =====================================================
   ZONA INICIAL
===================================================== */

const parametros =
    new URLSearchParams(window.location.search);

const zonaURL =
    parametros.get("zona");


let zonaInicial =
    ["A", "B", "C", "D", "E", "F"].includes(zonaURL)
        ? zonaURL
        : "A";


document
    .querySelector(`[data-zona="${zonaInicial}"]`)
    .classList.add("activo");


mostrarTabla(zonaInicial);

</script>

</body>
</html>
