<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Posiciones | Liga Tucson</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f6fa;
      color: #172b4d;
    }

    header {
      background: #071d49;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #9ed8ff;
    }

    nav {
      background: white;
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    nav a {
      text-decoration: none;
      color: #071d49;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 8px;
    }

    nav a:hover {
      background: #e7f4ff;
    }

    .contenedor {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 20px;
    }

    .titulo h2 {
      margin-bottom: 5px;
    }

    .filtros {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filtros button {
      border: none;
      background: #dceeff;
      color: #071d49;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .filtros button:hover {
      background: #b9e1ff;
    }

    .filtros button.activo {
      background: #071d49;
      color: white;
    }

    .zona {
      background: white;
      border-radius: 14px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .zona-titulo {
      background: #071d49;
      color: white;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #e8f4fc;
      color: #071d49;
      padding: 12px 8px;
      font-size: 13px;
    }

    td {
      padding: 12px 8px;
      text-align: center;
      border-top: 1px solid #eeeeee;
      font-size: 14px;
    }

    td:nth-child(2) {
      text-align: left;
      font-weight: bold;
    }

    tr:hover {
      background: #f7fbff;
    }

    .posicion {
      font-weight: bold;
      width: 40px;
    }

    .puntos {
      font-weight: bold;
      color: #071d49;
    }

    .equipo-link {
      text-decoration: none;
      color: #071d49;
    }

    .equipo-link:hover {
      color: #168bd3;
    }

    .sin-resultados {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .contenedor {
        margin-top: 15px;
      }

      .zona-titulo {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ LIGA TUCSON</h1>
  <p>Primera División A - Clausura 2026</p>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="posiciones.html">Posiciones</a>
  <a href="partidos.html">Partidos</a>
  <a href="equipos.html">Equipos</a>
</nav>

<div class="contenedor">

  <div class="titulo">
    <h2>Tabla de posiciones</h2>
    <p>Primera División A · Clausura 2026</p>
  </div>

  <div class="filtros">
    <button onclick="mostrarZona('todas')" id="btn-todas">
      Todas
    </button>

    <button onclick="mostrarZona('A')" id="btn-A">
      Zona A
    </button>

    <button onclick="mostrarZona('B')" id="btn-B">
      Zona B
    </button>

    <button onclick="mostrarZona('C')" id="btn-C">
      Zona C
    </button>

    <button onclick="mostrarZona('D')" id="btn-D">
      Zona D
    </button>

    <button onclick="mostrarZona('E')" id="btn-E">
      Zona E
    </button>

    <button onclick="mostrarZona('F')" id="btn-F">
      Zona F
    </button>
  </div>

  <div id="tablas"></div>

</div>

<script src="datos.js"></script>

<script>

  const contenedor = document.getElementById("tablas");

  const zonas = ["A", "B", "C", "D", "E", "F"];

  function calcularPuntos(equipo) {
    return (Number(equipo.pg) * 3) + Number(equipo.pe);
  }

  function crearTabla(zona) {

    const equipos = datosLiga.zonas[zona];

    if (!equipos || equipos.length === 0) {
      return;
    }

    const equiposOrdenados = [...equipos].sort((a, b) => {

      const puntosA = calcularPuntos(a);
      const puntosB = calcularPuntos(b);

      if (puntosB !== puntosA) {
        return puntosB - puntosA;
      }

      if (Number(b.dg) !== Number(a.dg)) {
        return Number(b.dg) - Number(a.dg);
      }

      return Number(b.gf) - Number(a.gf);
    });

    const zonaDiv = document.createElement("div");
    zonaDiv.className = "zona";

    let html = `
      <div class="zona-titulo">
        Zona ${zona}
      </div>

      <div class="tabla-contenedor">
        <table>

          <thead>
            <tr>
              <th>#</th>
              <th>Equipo</th>
              <th>PJ</th>
              <th>PG</th>
              <th>PE</th>
              <th>PP</th>
              <th>GF</th>
              <th>GC</th>
              <th>DG</th>
              <th>PTS</th>
            </tr>
          </thead>

          <tbody>
    `;

    equiposOrdenados.forEach((equipo, index) => {

      const puntos = calcularPuntos(equipo);

      html += `
        <tr>

          <td class="posicion">
            ${index + 1}
          </td>

          <td>
            <a
              class="equipo-link"
              href="equipo.html?v=6&equipo=${encodeURIComponent(equipo.equipo)}&zona=${encodeURIComponent(zona)}"
            >
              ${equipo.equipo}
            </a>
          </td>

          <td>${equipo.pj}</td>
          <td>${equipo.pg}</td>
          <td>${equipo.pe}</td>
          <td>${equipo.pp}</td>
          <td>${equipo.gf}</td>
          <td>${equipo.gc}</td>
          <td>${equipo.dg}</td>

          <td class="puntos">
            ${puntos}
          </td>

        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;

    zonaDiv.innerHTML = html;

    contenedor.appendChild(zonaDiv);
  }


  function mostrarZona(zonaSeleccionada) {

    contenedor.innerHTML = "";

    document.querySelectorAll(".filtros button").forEach(btn => {
      btn.classList.remove("activo");
    });

    const botonActivo =
      document.getElementById(
        zonaSeleccionada === "todas"
          ? "btn-todas"
          : "btn-" + zonaSeleccionada
      );

    if (botonActivo) {
      botonActivo.classList.add("activo");
    }

    if (zonaSeleccionada === "todas") {

      zonas.forEach(zona => {
        crearTabla(zona);
      });

    } else {

      crearTabla(zonaSeleccionada);

    }
  }


  // Leer la zona desde la URL
  const parametros = new URLSearchParams(window.location.search);

  const zonaURL = parametros.get("zona");

  if (zonas.includes(zonaURL)) {
    mostrarZona(zonaURL);
  } else {
    mostrarZona("todas");
  }

</script>

</body>
</html>
