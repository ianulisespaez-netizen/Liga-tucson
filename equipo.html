<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipo - Liga Tucson</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #173d6b;
        }

        header {
            background: linear-gradient(135deg, #173d6b, #4d86bd);
            color: white;
            text-align: center;
            padding: 25px;
        }

        .contenedor {
            padding: 30px 20px;
            text-align: center;
        }

        .tarjeta {
            background: white;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            font-size: 35px;
        }

        .pelota {
            font-size: 70px;
        }

        .volver {
            display: block;
            text-align: left;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #173d6b;
            text-decoration: none;
        }

    </style>

</head>

<body>

<header>
    <h1>⚽ LIGA TUCSON</h1>
</header>

<div class="contenedor">

    <a href="equipos.html" class="volver">
        ← Volver a equipos
    </a>

    <div class="tarjeta">

        <div class="pelota">
            ⚽
        </div>

        <h2 id="nombreEquipo">
            Cargando...
        </h2>

        <p>
            Esta página funciona correctamente.
        </p>

    </div>

</div>

<script>

    const parametros = new URLSearchParams(window.location.search);

    const equipo = parametros.get("equipo");

    document.getElementById("nombreEquipo").textContent =
        equipo || "Equipo no recibido";

</script>

</body>

</html>
