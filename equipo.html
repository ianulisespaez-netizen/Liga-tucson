<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil del equipo | Liga Tucson</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fa;
    color: #102a43;
}

/* =========================
   HEADER
========================= */

header {
    background: #061a33;
    color: white;
    padding: 15px 20px;
}

.header-contenido {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo-liga {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.titulo {
    flex: 1;
}

.titulo h1 {
    margin: 0;
    font-size: 25px;
}

.titulo p {
    margin: 4px 0 0;
    color: #8bdcff;
    font-size: 13px;
}

/* =========================
   NAV
========================= */

nav {
    background: #0b3158;
    padding: 10px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
}

nav a:hover {
    color: #7edcff;
}

/* =========================
   CONTENEDOR
========================= */

.contenedor {
    max-width: 1050px;
    margin: auto;
    padding: 25px 15px;
}

/* =========================
   PERFIL PRINCIPAL
========================= */

.perfil {
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(30, 55, 80, 0.08);
    text-align: center;
}

.escudo-principal {
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin-bottom: 15px;
}

.nombre-club {
    margin: 0;
    font-size: 32px;
    color: #061a33;
}

.torneo {
    margin-top: 8px;
    color: #65788c;
    font-size: 16px;
}

.zona {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 18px;
    background: #e0f0fa;
    color: #087ec4;
    border-radius: 25px;
    font-weight: bold;
}

/* =========================
   ESTADÍSTICAS
========================= */

.estadisticas {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 30px;
}

.estadistica {
    background: #f3f7fa;
    border-radius: 15px;
    padding: 15px 8px;
}

.estadistica strong {
    display: block;
    font-size: 25px;
    color: #061a33;
}

.estadistica span {
    display: block;
    margin-top: 5px;
    color: #68798c;
    font-size: 13px;
    font-weight: bold;
}

/* =========================
   PUNTOS
========================= */

.puntos {
    margin-top: 15px;
    background: #061a33;
    color: white;
    border-radius: 15px;
    padding: 15px;
}

.puntos strong {
    font-size: 30px;
}

.puntos span {
    display: block;
    color: #8bdcff;
    margin-top: 3px;
}

/* =========================
   SECCIONES
========================= */

.seccion {
    margin-top: 30px;
}

.titulo-seccion {
    color: #061a33;
    font-size: 23px;
    margin-bottom: 15px;
}

/* =========================
   POSICIÓN
========================= */

.posicion-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 5px 18px rgba(30, 55, 80, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.posicion-numero {
    font-size: 38px;
    font-weight: bold;
    color: #087ec4;
}

.posicion-texto {
    color: #65788c;
    text-align: right;
}

.posicion-texto strong {
    display: block;
    color: #102a43;
    font-size: 18px;
}

/* =========================
   PARTIDOS
========================= */

.lista-partidos {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.partido {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 5px 18px rgba(30, 55, 80, 0.06);
}

.partido-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.fecha {
    color: #68798c;
    font-weight: bold;
}

.estado {
    padding: 6px 13px;
    border-radius: 20px;
    background: #dff3e7;
    color: #287548;
    font-weight: bold;
    font-size: 13px;
}

.estado.proximo {
    background: #e2f0fb;
    color: #287fc2;
}

.enfrentamiento {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
    gap: 10px;
}

.equipo-partido {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.escudo-partido {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 8px;
}

.nombre-partido {
    font-size: 16px;
    font-weight: bold;
    color: #102a43;
}

.resultado {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    color: #061a33;
}

.vs {
    font-size: 22px;
    color: #789;
}

.info-partido {
    border-top: 1px solid #e6edf2;
    margin-top: 18px;
    padding-top: 12px;
    text-align: center;
    color: #718296;
    font-size: 13px;
}

/* =========================
   BOTÓN VOLVER
========================= */

.volver {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 22px;
    border-radius: 12px;
    background: #087ec4;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.volver:hover {
    background: #06699f;
}

/* =========================
   ERROR
========================= */

.error {
    background: white;
    border-radius: 20px;
    padding: 35px;
    text-align: center;
}

.error h2 {
    color: #061a33;
}

.error p {
    color: #718296;
}

/* =========================
   FOOTER
========================= */

footer {
    margin-top: 45px;
    background: #061a33;
    color: white;
    text-align: center;
    padding: 20px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .header-contenido {
        flex-direction: column;
        text-align: center;
    }

    nav a {
        display: inline-block;
        margin: 5px 7px;
    }

    .perfil {
        padding: 25px 15px;
    }

    .escudo-principal {
        width: 130px;
        height: 130px;
    }

    .nombre-club {
        font-size: 27px;
    }

    .estadisticas {
        grid-template-columns: repeat(2, 1fr);
    }

    .estadistica strong {
        font-size: 23px;
    }

    .enfrentamiento {
        grid-template-columns: 1fr 55px 1fr;
    }

    .escudo-partido {
        width: 65px;
        height: 65px;
    }

    .nombre-partido {
        font-size: 14px;
    }

    .resultado {
        font-size: 24px;
    }

}

</style>
</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-contenido">

        <img
            class="logo-liga"
            src="https://raw.githubusercontent.com/ianulisespaez-netizen/Liga-tucson/main/FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
            alt="Liga Tucson"
        >

        <div class="titulo">

            <h1>⚽ LIGA TUCSON</h1>

            <p>
                Primera División A - Clausura 2026
            </p>

        </div>

    </div>

</header>


<!-- =========================
     NAVEGACIÓN
========================= -->

<nav>

    <a href="index.html">Inicio</a>
    <a href="posiciones.html">Posiciones</a>
    <a href="partidos.html">Partidos</a>
    <a href="equipos.html">Equipos</a>

</nav>


<!-- =========================
     CONTENIDO
========================= -->

<div class="contenedor">

    <div id="contenido-equipo"></div>

</div>


<footer>

    Liga Tucson © 2026

</footer>


<script src="datos.js"></script>


<script>

/* =====================================================
   ESCUDOS
===================================================== */

const escudos = {

    "Talleres": "IMG_1621.png",
    "Juventud Unida": "IMG_1622.png",
    "Estación Experimental": "IMG_1623.png",
    "Central Norte": "21B48DFD-98C8-4EDD-B633-35738F9B089D.png",
    "Villa Mitre": "IMG_1625.jpeg",
    "All Boys": "IMG_1627.png",
    "San José": "IMG_1628.png",

    "Argentinos del Norte": "IMG_1629.png",
    "San Martín": "IMG_1630.png",
    "San Antonio": "IMG_1631.jpeg",
    "Atlético Tucumán": "IMG_1632.jpeg",
    "Sportivo Guzmán": "IMG_1633.png",
    "Amalia": "IMG_1634.png",
    "Tucumán Central": "IMG_1635.png",

    "Garmendia": "IMG_1637.jpeg",
    "Atlético Concepción": "IMG_1638.png",
    "San Juan": "9D389031-3751-4B06-A800-AE5B7A426605.png",
    "San Lorenzo (DG)": "IMG_1646.png",
    "Unión del Norte": "IMG_1641.jpeg",
    "Lastenia": "IMG_1645.png",
    "Cruz Alta": "IMG_1644.png",

    "Bella Vista": "IMG_1651.png",
    "San Fernando": "IMG_1652.png",
    "Almirante Brown": "IMG_1653.jpeg",
    "Famaillá": "IMG_1654.png",
    "Ateneo Parroquial Alderetes": "IMG_1655.png",
    "Santa Lucía": "IMG_1656.jpeg",
    "San Pablo": "IMG_1671.png",

    "Alto Verde": "IMG_1657.png",
    "Concepción FC": "IMG_1658.png",
    "Azucarera Argentina": "IMG_1659.png",
    "Ñuñorco": "IMG_1660.png",
    "Unión Simoca": "IMG_1661.jpeg",
    "San Ramón": "IMG_1662.jpeg",
    "Santa Rosa": "IMG_1663.png",
    "La Providencia": "IMG_1664.jpeg",

    "Deportivo Aguilares": "IMG_1665.png",
    "San Lorenzo (SA)": "IMG_1666.webp",
    "Jorge Newbery": "IMG_1673.png",
    "Graneros": "IMG_1667.jpeg",
    "Santa Ana": "IMG_1668.png",
    "Trinidad": "IMG_1669.png",
    "Marapa": "IMG_1670.jpeg",
    "Llorens": "IMG_1672.jpeg"

};


/* =====================================================
   OBTENER DATOS DE URL
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );

const nombreEquipo =
    parametros.get("equipo");

const zonaURL =
    parametros.get("zona");


/* =====================================================
   CONTENEDOR
===================================================== */

const contenido =
    document.getElementById(
        "contenido-equipo"
    );


/* =====================================================
   BUSCAR EQUIPO
===================================================== */

let equipoEncontrado = null;
let zonaEncontrada = null;


/* Si viene la zona, buscamos primero ahí */

if (zonaURL && datosLiga.zonas[zonaURL]) {

    equipoEncontrado =
        datosLiga.zonas[zonaURL].find(
            equipo =>
                equipo.equipo === nombreEquipo
        );

    if (equipoEncontrado) {
        zonaEncontrada = zonaURL;
    }

}


/* Si no lo encontró, buscar en todas */

if (!equipoEncontrado) {

    for (
        const zona of
        ["A", "B", "C", "D", "E", "F"]
    ) {

        const lista =
            datosLiga.zonas[zona];

        if (!lista) continue;

        const encontrado =
            lista.find(
                equipo =>
                    equipo.equipo === nombreEquipo
            );

        if (encontrado) {

            equipoEncontrado =
                encontrado;

            zonaEncontrada =
                zona;

            break;

        }

    }

}


/* =====================================================
   ERROR
===================================================== */

if (!equipoEncontrado) {

    contenido.innerHTML = `

        <div class="error">

            <h2>⚠️ Equipo no encontrado</h2>

            <p>
                No pudimos encontrar la información
                del equipo solicitado.
            </p>

            <a
                class="volver"
                href="equipos.html"
            >
                ← Volver a equipos
            </a>

        </div>

    `;

}


/* =====================================================
   MOSTRAR EQUIPO
===================================================== */

else {

    const equipo =
        equipoEncontrado;

    const zona =
        zonaEncontrada;


    /* =========================
       PUNTOS
    ========================= */

    const puntos =
        (equipo.pg * 3) +
        equipo.pe;


    /* =========================
       POSICIÓN
    ========================= */

    const tabla =
        [...datosLiga.zonas[zona]]
        .sort((a, b) => {

            const puntosA =
                a.pg * 3 + a.pe;

            const puntosB =
                b.pg * 3 + b.pe;

            if (puntosB !== puntosA) {
                return puntosB - puntosA;
            }

            if (b.dg !== a.dg) {
                return b.dg - a.dg;
            }

            return b.gf - a.gf;

        });


    const posicion =
        tabla.findIndex(
            e => e.equipo === equipo.equipo
        ) + 1;


    /* =========================
       PARTIDOS DEL EQUIPO
    ========================= */

    const partidosEquipo =
        (datosLiga.partidos || [])
        .filter(partido =>
            partido.local === equipo.equipo ||
            partido.visitante === equipo.equipo
        );


    /* =========================
       PERFIL
    ========================= */

    contenido.innerHTML = `

        <div class="perfil">

            <img
                class="escudo-principal"
                src="${escudos[equipo.equipo]}"
                alt="Escudo de ${equipo.equipo}"
            >

            <h1 class="nombre-club">

                ${equipo.equipo}

            </h1>

            <div class="torneo">

                Primera División A -
                Clausura 2026

            </div>

            <div class="zona">

                Zona ${zona}

            </div>


            <!-- ESTADÍSTICAS -->

            <div class="estadisticas">

                <div class="estadistica">

                    <strong>
                        ${equipo.pj}
                    </strong>

                    <span>
                        PJ
                    </span>

                </div>


                <div class="estadistica">

                    <strong>
                        ${equipo.pg}
                    </strong>

                    <span>
                        PG
                    </span>

                </div>


                <div class="estadistica">

                    <strong>
                        ${equipo.pe}
                    </strong>

                    <span>
                        PE
                    </span>

                </div>


                <div class="estadistica">

                    <strong>
                        ${equipo.pp}
                    </strong>

                    <span>
                        PP
                    </span>

                </div>


                <div class="estadistica">

                    <strong>
                        ${equipo.gf}
                    </strong>

                    <span>
                        GF
                    </span>

                </div>


                <div class="estadistica">

                    <strong>
                        ${equipo.gc}
                    </strong>

                    <span>
                        GC
                    </span>

                </div>


                <div class="estadistica">

                    <strong>
                        ${equipo.dg}
                    </strong>

                    <span>
                        DG
                    </span>

                </div>


                <div class="estadistica">

                    <strong>
                        ${puntos}
                    </strong>

                    <span>
                        PUNTOS
                    </span>

                </div>

            </div>


            <div class="puntos">

                <strong>
                    ${puntos}
                </strong>

                <span>
                    Puntos obtenidos
                </span>

            </div>

        </div>


        <!-- =========================
             POSICIÓN
        ========================= -->

        <div class="seccion">

            <h2 class="titulo-seccion">

                📊 Posición en la zona

            </h2>


            <div class="posicion-card">

                <div class="posicion-numero">

                    ${posicion}°

                </div>


                <div class="posicion-texto">

                    <strong>
                        Zona ${zona}
                    </strong>

                    Posición actual

                </div>

            </div>

        </div>


        <!-- =========================
             PARTIDOS
        ========================= -->

        <div class="seccion">

            <h2 class="titulo-seccion">

                ⚽ Partidos

            </h2>


            <div
                id="lista-partidos"
                class="lista-partidos"
            ></div>

        </div>


        <a
            class="volver"
            href="equipos.html"
        >
            ← Volver a equipos
        </a>

    `;


    /* =================================================
       MOSTRAR PARTIDOS
    ================================================= */

    const listaPartidos =
        document.getElementById(
            "lista-partidos"
        );


    if (partidosEquipo.length === 0) {

        listaPartidos.innerHTML = `

            <div class="error">

                <p>
                    Todavía no hay partidos
                    cargados para este equipo.
                </p>

            </div>

        `;

    }


    else {

        partidosEquipo.forEach(partido => {

            const esLocal =
                partido.local === equipo.equipo;

            const rival =
                esLocal
                    ? partido.visitante
                    : partido.local;


            const escudoRival =
                escudos[rival];


            const tieneResultado =

                partido.golesLocal !== undefined &&
                partido.golesLocal !== null &&
                partido.golesVisitante !== undefined &&
                partido.golesVisitante !== null;


            let resultadoHTML;


            if (tieneResultado) {

                resultadoHTML = `

                    <div class="resultado">

                        ${partido.golesLocal}
                        -
                        ${partido.golesVisitante}

                    </div>

                `;

            }

            else {

                resultadoHTML = `

                    <div class="resultado vs">

                        VS

                    </div>

                `;

            }


            const estadoHTML =

                tieneResultado

                    ? `

                        <span class="estado">

                            Finalizado

                        </span>

                      `

                    : `

                        <span class="estado proximo">

                            Próximo

                        </span>

                      `;


            listaPartidos.innerHTML += `

                <div class="partido">


                    <div class="partido-cabecera">

                        <span class="fecha">

                            Fecha ${partido.fecha || "—"}

                        </span>

                        ${estadoHTML}

                    </div>


                    <div class="enfrentamiento">


                        <!-- LOCAL -->

                        <div class="equipo-partido">

                            <img
                                class="escudo-partido"
                                src="${escudos[partido.local]}"
                                alt="${partido.local}"
                            >

                            <div class="nombre-partido">

                                ${partido.local}

                            </div>

                        </div>


                        <!-- RESULTADO -->

                        ${resultadoHTML}


                        <!-- VISITANTE -->

                        <div class="equipo-partido">

                            <img
                                class="escudo-partido"
                                src="${escudos[partido.visitante]}"
                                alt="${partido.visitante}"
                            >

                            <div class="nombre-partido">

                                ${partido.visitante}

                            </div>

                        </div>


                    </div>


                    <div class="info-partido">

                        📍 Cancha por confirmar

                    </div>

                </div>

            `;

        });

    }

}

</script>

</body>
</html>
