<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Equipo | Liga Tucson</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #071b3a;
      color: white;
      padding: 15px 20px;
      text-align: center;
    }

    header img {
      width: 90px;
      max-width: 100%;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    nav a {
      color: white;
      text-decoration: none;
      background: #123665;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.2s;
    }

    nav a:hover {
      background: #1d4f91;
    }

    nav a.activo {
      background: #159bd7;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .volver {
      display: inline-block;
      margin-bottom: 18px;
      color: #075ca8;
      text-decoration: none;
      font-weight: bold;
    }

    .volver:hover {
      text-decoration: underline;
    }

    .perfil {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .perfil img {
      width: 125px;
      height: 125px;
      object-fit: contain;
      background: #f7f9fc;
      border-radius: 15px;
      padding: 10px;
    }

    .perfil-info {
      flex: 1;
    }

    .perfil-info h2 {
      font-size: 30px;
      color: #071b3a;
      margin-bottom: 8px;
    }

    .zona {
      display: inline-block;
      background: #159bd7;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .posicion {
      font-size: 18px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 15px 8px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      color: #071b3a;
      margin-bottom: 5px;
    }

    .stat span {
      font-size: 12px;
      color: #657083;
      font-weight: bold;
    }

    .seccion {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .seccion h3 {
      color: #071b3a;
      margin-bottom: 15px;
      font-size: 21px;
    }

    .partido {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 10px;
      border-bottom: 1px solid #e6eaf0;
    }

    .partido:last-child {
      border-bottom: none;
    }

    .fecha {
      width: 75px;
      font-size: 12px;
      color: #68758a;
      font-weight: bold;
    }

    .rivales {
      flex: 1;
      text-align: center;
      font-weight: bold;
    }

    .resultado {
      min-width: 70px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .ganado {
      color: #16803c;
    }

    .empatado {
      color: #d48a00;
    }

    .perdido {
      color: #c62828;
    }

    .proximo {
      color: #075ca8;
    }

    .tipo {
      font-size: 11px;
      color: #7b8798;
      margin-top: 3px;
      font-weight: normal;
    }

    .sin-partidos {
      text-align: center;
      padding: 20px;
      color: #7a8596;
    }

    .playoff-card {
      background: linear-gradient(135deg, #071b3a, #123f76);
      color: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      margin-bottom: 25px;
    }

    .playoff-card h3 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .playoff-card p {
      color: #dcecff;
      margin-bottom: 15px;
    }

    .playoff-btn {
      display: inline-block;
      background: #159bd7;
      color: white;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 10px;
      font-weight: bold;
    }

    .playoff-btn:hover {
      background: #35afe4;
    }

    .error {
      background: white;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .error h2 {
      color: #c62828;
      margin-bottom: 10px;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }

      .perfil {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 22px;
      }

      nav a {
        font-size: 12px;
        padding: 8px 9px;
      }

      .perfil img {
        width: 105px;
        height: 105px;
      }

      .perfil-info h2 {
        font-size: 25px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .partido {
        flex-wrap: wrap;
      }

      .fecha {
        width: 100%;
      }

      .rivales {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>

  <img
    src="FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
    alt="Liga Tucson"
  >

  <h1>LIGA TUCSON</h1>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="posiciones.html">Posiciones</a>
    <a href="partidos.html">Partidos</a>
    <a href="equipos.html">Equipos</a>
    <a href="playoff.html">🏆 Play-Off</a>
  </nav>

</header>


<main>

  <a href="equipos.html" class="volver">
    ← Volver a equipos
  </a>

  <div id="contenido"></div>

</main>


<script src="datos.js"></script>

<script>

  /* =========================================================
     ESCUDOS
     ========================================================= */

  const escudos = {

    /* ZONA A */
    "Talleres": "IMG_1621.png",
    "Juventud Unida": "IMG_1622.png",
    "Estación Experimental": "IMG_1623.png",
    "Central Norte": "21B48DFD-98C8-4EDD-B633-35738F9B089D.png",
    "Villa Mitre": "IMG_1625.jpeg",
    "All Boys": "IMG_1627.png",
    "San José": "IMG_1628.png",

    /* ZONA B */
    "Argentinos del Norte": "IMG_1629.png",
    "San Martín": "IMG_1630.png",
    "San Antonio": "IMG_1631.jpeg",
    "Atlético Tucumán": "IMG_1632.jpeg",
    "Sportivo Guzmán": "IMG_1633.png",
    "Amalia": "IMG_1634.png",
    "Tucumán Central": "IMG_1635.png",

    /* ZONA C */
    "Garmendia": "IMG_1637.jpeg",
    "Atlético Concepción": "IMG_1638.png",
    "San Juan": "9D389031-3751-4B06-A800-AE5B7A426605.png",
    "San Lorenzo (DG)": "IMG_1646.png",
    "Unión del Norte": "IMG_1641.jpeg",
    "Lastenia": "IMG_1645.png",
    "Cruz Alta": "IMG_1644.png",

    /* ZONA D */
    "Bella Vista": "IMG_1651.png",
    "San Fernando": "IMG_1652.png",
    "Almirante Brown": "IMG_1653.jpeg",
    "Famaillá": "IMG_1654.png",
    "Ateneo Parroquial Alderetes": "IMG_1655.png",
    "Santa Lucía": "IMG_1656.jpeg",
    "San Pablo": "IMG_1671.png",

    /* ZONA E */
    "Alto Verde": "IMG_1657.png",
    "Concepción FC": "IMG_1658.png",
    "Azucarera Argentina": "IMG_1659.png",
    "Ñuñorco": "IMG_1660.png",
    "Unión Simoca": "IMG_1661.jpeg",
    "San Ramón": "IMG_1662.jpeg",
    "Santa Rosa": "IMG_1663.png",
    "La Providencia": "IMG_1664.jpeg",

    /* ZONA F */
    "Deportivo Aguilares": "IMG_1665.png",
    "San Lorenzo (SA)": "IMG_1666.webp",
    "Jorge Newbery": "IMG_1673.png",
    "Graneros": "IMG_1667.jpeg",
    "Santa Ana": "IMG_1668.png",
    "Trinidad": "IMG_1669.png",
    "Marapa": "IMG_1670.jpeg",
    "Llorens": "IMG_1672.jpeg"
  };


  /* =========================================================
     PARÁMETROS DE LA URL
     ========================================================= */

  const params = new URLSearchParams(window.location.search);

  const nombreEquipo = params.get("equipo");
  const zonaParametro = params.get("zona");


  /* =========================================================
     BUSCAR EQUIPO
     ========================================================= */

  let equipoEncontrado = null;
  let zonaEncontrada = zonaParametro || null;

  if (
    typeof datosLiga !== "undefined" &&
    datosLiga.zonas
  ) {

    for (const zona in datosLiga.zonas) {

      const encontrado = datosLiga.zonas[zona].find(
        e => e.equipo === nombreEquipo
      );

      if (encontrado) {
        equipoEncontrado = encontrado;
        zonaEncontrada = zona;
        break;
      }
    }
  }


  /* =========================================================
     MOSTRAR ERROR
     ========================================================= */

  if (!equipoEncontrado) {

    document.getElementById("contenido").innerHTML = `
      <div class="error">
        <h2>Equipo no encontrado</h2>
        <p>No se pudo encontrar el equipo solicitado.</p>
        <br>
        <a href="equipos.html">Volver a equipos</a>
      </div>
    `;

  } else {

    /* =======================================================
       TABLA DE LA ZONA
       ======================================================= */

    const equiposZona = [...datosLiga.zonas[zonaEncontrada]];

    equiposZona.sort((a, b) => {

      if (b.pts !== a.pts)
        return b.pts - a.pts;

      if (b.dg !== a.dg)
        return b.dg - a.dg;

      if (b.gf !== a.gf)
        return b.gf - a.gf;

      if (a.gc !== b.gc)
        return a.gc - b.gc;

      return a.equipo.localeCompare(b.equipo);
    });


    const posicion =
      equiposZona.findIndex(
        e => e.equipo === equipoEncontrado.equipo
      ) + 1;


    /* =======================================================
       PARTIDOS DEL EQUIPO
       ======================================================= */

    let partidosEquipo = [];

    if (
      typeof datosLiga !== "undefined" &&
      Array.isArray(datosLiga.partidos)
    ) {

      partidosEquipo = datosLiga.partidos.filter(partido => {

        return (
          partido.local === nombreEquipo ||
          partido.visitante === nombreEquipo
        );

      });

    }


    /* =======================================================
       ORDENAR POR FECHA
       ======================================================= */

    partidosEquipo.sort((a, b) => {

      return (a.fecha || 0) - (b.fecha || 0);

    });


    /* =======================================================
       SEPARAR JUGADOS Y PRÓXIMOS
       ======================================================= */

    const jugados = partidosEquipo.filter(
      partido =>
        partido.golesLocal !== null &&
        partido.golesLocal !== undefined &&
        partido.golesVisitante !== null &&
        partido.golesVisitante !== undefined
    );

    const proximos = partidosEquipo.filter(
      partido =>
        partido.golesLocal === null ||
        partido.golesLocal === undefined ||
        partido.golesVisitante === null ||
        partido.golesVisitante === undefined
    );


    /* =======================================================
       RENDER PERFIL
       ======================================================= */

    let html = `

      <section class="perfil">

        <img
          src="${escudos[nombreEquipo] || ""}"
          alt="Escudo de ${nombreEquipo}"
          onerror="this.style.display='none'"
        >

        <div class="perfil-info">

          <div class="zona">
            Zona ${zonaEncontrada}
          </div>

          <h2>${nombreEquipo}</h2>

          <div class="posicion">
            ${posicion}° puesto
          </div>

        </div>

      </section>


      <section class="stats">

        <div class="stat">
          <strong>${equipoEncontrado.pj || 0}</strong>
          <span>PJ</span>
        </div>

        <div class="stat">
          <strong>${equipoEncontrado.pg || 0}</strong>
          <span>PG</span>
        </div>

        <div class="stat">
          <strong>${equipoEncontrado.pe || 0}</strong>
          <span>PE</span>
        </div>

        <div class="stat">
          <strong>${equipoEncontrado.pp || 0}</strong>
          <span>PP</span>
        </div>

        <div class="stat">
          <strong>${equipoEncontrado.gf || 0}</strong>
          <span>GF</span>
        </div>

        <div class="stat">
          <strong>${equipoEncontrado.gc || 0}</strong>
          <span>GC</span>
        </div>

        <div class="stat">
          <strong>${equipoEncontrado.dg || 0}</strong>
          <span>DG</span>
        </div>

        <div class="stat">
          <strong>${equipoEncontrado.pts || 0}</strong>
          <span>PTS</span>
        </div>

      </section>

    `;


    /* =======================================================
       PLAY-OFF
       ======================================================= */

    html += `

      <section class="playoff-card">

        <h3>🏆 Play-Off</h3>

        <p>
          Consultá la clasificación y las llaves del
          Play-Off del Clausura 2026.
        </p>

        <a
          href="playoff.html"
          class="playoff-btn"
        >
          Ver Play-Off
        </a>

      </section>

    `;


    /* =======================================================
       PARTIDOS JUGADOS
       ======================================================= */

    html += `

      <section class="seccion">

        <h3>📋 Partidos jugados</h3>

    `;


    if (jugados.length === 0) {

      html += `
        <div class="sin-partidos">
          Todavía no hay partidos registrados.
        </div>
      `;

    } else {

      jugados.forEach(partido => {

        const esLocal =
          partido.local === nombreEquipo;

        const rival =
          esLocal
            ? partido.visitante
            : partido.local;

        const golesEquipo =
          esLocal
            ? partido.golesLocal
            : partido.golesVisitante;

        const golesRival =
          esLocal
            ? partido.golesVisitante
            : partido.golesLocal;


        let claseResultado = "";

        if (golesEquipo > golesRival) {
          claseResultado = "ganado";
        } else if (golesEquipo === golesRival) {
          claseResultado = "empatado";
        } else {
          claseResultado = "perdido";
        }


        const tipoPartido =
          partido.interzonal
            ? "Interzonal"
            : `Zona ${zonaEncontrada}`;


        html += `

          <div class="partido">

            <div class="fecha">
              Fecha ${partido.fecha || "-"}
            </div>

            <div class="rivales">

              ${esLocal ? "🏠 " : ""}
              ${nombreEquipo}

              <br>

              ${esLocal ? "vs." : "@ "}
              ${rival}

              <div class="tipo">
                ${tipoPartido}
              </div>

            </div>

            <div class="resultado ${claseResultado}">
              ${golesEquipo} - ${golesRival}
            </div>

          </div>

        `;

      });

    }


    html += `

      </section>

    `;


    /* =======================================================
       PRÓXIMOS PARTIDOS
       ======================================================= */

    html += `

      <section class="seccion">

        <h3>📅 Próximos partidos</h3>

    `;


    if (proximos.length === 0) {

      html += `
        <div class="sin-partidos">
          No hay próximos partidos cargados.
        </div>
      `;

    } else {

      proximos.forEach(partido => {

        const esLocal =
          partido.local === nombreEquipo;

        const rival =
          esLocal
            ? partido.visitante
            : partido.local;


        const tipoPartido =
          partido.interzonal
            ? "Interzonal"
            : `Zona ${zonaEncontrada}`;


        html += `

          <div class="partido">

            <div class="fecha">
              Fecha ${partido.fecha || "-"}
            </div>

            <div class="rivales">

              ${esLocal ? "🏠 " : ""}
              ${nombreEquipo}

              <br>

              ${esLocal ? "vs." : "@ "}
              ${rival}

              <div class="tipo">
                ${tipoPartido}
              </div>

            </div>

            <div class="resultado proximo">
              Próximo
            </div>

          </div>

        `;

      });

    }


    html += `

      </section>

    `;


    /* =======================================================
       MOSTRAR TODO
       ======================================================= */

    document.getElementById("contenido").innerHTML = html;

  }

</script>

</body>
</html>
