<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipo - Liga Tucson</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172f55;
        }

        header {
            background: linear-gradient(135deg, #173d6b, #4d86bd);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            padding: 25px 18px;
        }

        .volver {
            display: inline-block;
            color: #173d6b;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .tarjeta {
            background: white;
            border-radius: 22px;
            padding: 35px 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .equipo-header {
            text-align: center;
        }

        .pelota {
            font-size: 75px;
            margin-bottom: 10px;
        }

        .equipo-header h2 {
            font-size: 42px;
            margin: 10px 0;
        }

        .zona {
            font-size: 22px;
            color: #687891;
            margin-bottom: 30px;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .estadistica {
            background: #f1f5f9;
            border-radius: 15px;
            padding: 25px 10px;
            text-align: center;
        }

        .numero {
            font-size: 40px;
            font-weight: bold;
            color: #173d6b;
        }

        .texto {
            font-size: 19px;
            color: #687891;
            margin-top: 5px;
        }

        .titulo-seccion {
            border-left: 8px solid #4ca0d8;
            padding-left: 15px;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .partido {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            padding: 20px 5px;
            border-bottom: 2px solid #e0e4e8;
            font-size: 19px;
        }

        .partido:last-child {
            border-bottom: none;
        }

        .local {
            text-align: left;
        }

        .visitante {
            text-align: right;
        }

        .resultado {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
        }

        .proximo {
            color: #4ca0d8;
        }

        .error {
            text-align: center;
            font-size: 22px;
            padding: 40px 10px;
        }

        @media (max-width: 600px) {

            .equipo-header h2 {
                font-size: 32px;
            }

            .estadisticas {
                gap: 12px;
            }

            .numero {
                font-size: 32px;
            }

            .texto {
                font-size: 16px;
            }

            .partido {
                font-size: 15px;
                gap: 8px;
            }

            .resultado {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ LIGA TUCSON</h1>
</header>

<div class="contenedor">

    <a href="equipos.html" class="volver">← Volver a equipos</a>

    <div id="contenido">
        Cargando equipo...
    </div>

</div>

<script src="datos.js"></script>

<script>

    // Obtener el nombre del equipo desde la URL
    const parametros = new URLSearchParams(window.location.search);
    const nombreEquipo = parametros.get("equipo");
    const zonaURL = parametros.get("zona");

    const contenido = document.getElementById("contenido");

    // Si no llegó ningún equipo
    if (!nombreEquipo) {

        contenido.innerHTML = `
            <div class="tarjeta error">
                No se encontró el equipo.
            </div>
        `;

    } else {

        // Obtener todos los equipos
        const todosLosEquipos = obtenerTodosLosEquipos();

        // Buscar el equipo por su nombre real
        const equipoEncontrado = todosLosEquipos.find(e =>
            e.equipo.toLowerCase() === nombreEquipo.toLowerCase()
        );

        if (!equipoEncontrado) {

            contenido.innerHTML = `
                <div class="tarjeta error">
                    <h2>Equipo no encontrado</h2>
                    <p>Buscamos: <strong>${nombreEquipo}</strong></p>
                    <a href="equipos.html">Volver a equipos</a>
                </div>
            `;

        } else {

            // Buscar la zona
            let zonaEncontrada = zonaURL;

            if (!zonaEncontrada) {

                for (const zona in datosLiga.zonas) {

                    const encontrado = datosLiga.zonas[zona].find(e =>
                        e.equipo.toLowerCase() === nombreEquipo.toLowerCase()
                    );

                    if (encontrado) {
                        zonaEncontrada = zona;
                        break;
                    }
                }
            }

            // Estadísticas
            const partidos = equipoEncontrado.PJ || 0;
            const ganados = equipoEncontrado.PG || 0;
            const empatados = equipoEncontrado.PE || 0;
            const perdidos = equipoEncontrado.PP || 0;
            const golesFavor = equipoEncontrado.GF || 0;
            const golesContra = equipoEncontrado.GC || 0;
            const diferencia = equipoEncontrado.DG || 0;

            const puntos = (ganados * 3) + empatados;

            // Buscar partidos del equipo
            const partidosEquipo = datosLiga.partidos.filter(p => {

                const local = p.local || "";
                const visitante = p.visitante || "";

                return (
                    local.toLowerCase() === equipoEncontrado.equipo.toLowerCase() ||
                    visitante.toLowerCase() === equipoEncontrado.equipo.toLowerCase()
                );
            });

            // Separar resultados y próximos
            const resultados = partidosEquipo.filter(p =>
                p.golesLocal !== undefined &&
                p.golesVisitante !== undefined
            );

            const proximos = partidosEquipo.filter(p =>
                p.golesLocal === undefined ||
                p.golesVisitante === undefined
            );

            contenido.innerHTML = `

                <div class="tarjeta">

                    <div class="equipo-header">

                        <div class="pelota">⚽</div>

                        <h2>${equipoEncontrado.equipo}</h2>

                        <div class="zona">
                            Zona ${zonaEncontrada || ""}
                        </div>

                    </div>

                    <div class="estadisticas">

                        <div class="estadistica">
                            <div class="numero">${partidos}</div>
                            <div class="texto">Partidos</div>
                        </div>

                        <div class="estadistica">
                            <div class="numero">${ganados}</div>
                            <div class="texto">Ganados</div>
                        </div>

                        <div class="estadistica">
                            <div class="numero">${empatados}</div>
                            <div class="texto">Empatados</div>
                        </div>

                        <div class="estadistica">
                            <div class="numero">${puntos}</div>
                            <div class="texto">Puntos</div>
                        </div>

                    </div>

                </div>


                <div class="tarjeta">

                    <h2 class="titulo-seccion">
                        Últimos partidos
                    </h2>

                    <div id="resultados">

                        ${
                            resultados.length === 0
                            ? "<p>No hay resultados cargados todavía.</p>"
                            : resultados.map(p => `

                                <div class="partido">

                                    <div class="local">
                                        ${p.local}
                                    </div>

                                    <div class="resultado">
                                        ${p.golesLocal} - ${p.golesVisitante}
                                    </div>

                                    <div class="visitante">
                                        ${p.visitante}
                                    </div>

                                </div>

                            `).join("")
                        }

                    </div>

                </div>


                <div class="tarjeta">

                    <h2 class="titulo-seccion">
                        Próximos partidos
                    </h2>

                    <div id="proximos">

                        ${
                            proximos.length === 0
                            ? "<p>No hay próximos partidos cargados todavía.</p>"
                            : proximos.map(p => `

                                <div class="partido">

                                    <div class="local">
                                        ${p.local}
                                    </div>

                                    <div class="resultado proximo">
                                        VS
                                    </div>

                                    <div class="visitante">
                                        ${p.visitante}
                                    </div>

                                </div>

                            `).join("")
                        }

                    </div>

                </div>

            `;
        }
    }

</script>

</body>
</html>
